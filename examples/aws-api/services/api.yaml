services:
  api:
    dir: handler
    compute:
      trigger: http
      handler: app.handler
      settings:
        memorySize: 256
        timeout: 10
    # A private network the service's other resources could sit inside.
    # kraai does not yet wire compute into a network binding's VPC (no
    # Lambda VpcConfig is built from it — see ../README.md's note on this
    # gap) so this binding is provisioned and torn down alongside the
    # service without the function actually running inside it.
    network:
      - { binding: NET, cidr: 10.90.0.0/16, subnet: 10.90.1.0/24 }
    # A standard SQS queue. The function receives JOBS_QUEUE_URL and
    # JOBS_QUEUE_ARN, and its execution role is granted the queue.
    queues:
      - { binding: JOBS }
    # A DynamoDB on-demand table keyed by pk, with createdAt as a numeric
    # sort key. The function receives DB_TABLE_NAME, and its execution role
    # is granted the table and its indexes.
    databases:
      - binding: DB
        driver: dynamodb
        partitionKey: { name: pk }
        sortKey: { name: createdAt, type: N }
