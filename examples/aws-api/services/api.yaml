services:
  api:
    dir: handler
    compute:
      trigger: http
      handler: app.handler
      settings:
        memorySize: 256
        timeout: 10
    # The private network the function runs inside. The private block opts
    # into egress: a private subnet with a NAT gateway in the public one,
    # and the function placed in the private subnet, so it reaches the
    # queue, the cluster and the internet. Billed by the hour while it
    # exists (see ../README.md).
    network:
      - { binding: NET, cidr: 10.90.0.0/16, subnet: 10.90.1.0/24, private: 10.90.2.0/24 }
    # A standard SQS queue. The function receives JOBS_QUEUE_URL and
    # JOBS_QUEUE_ARN, and its execution role is granted the queue.
    queues:
      - { binding: JOBS }
    # A DynamoDB on-demand table keyed by pk, with createdAt as a numeric
    # sort key. The function receives DB_TABLE_NAME, and its execution role
    # is granted the table and its indexes.
    databases:
      - binding: DB
        driver: dynamodb
        partitionKey: { name: pk }
        sortKey: { name: createdAt, type: N }
      # An Aurora DSQL cluster, reached over its public endpoint with an
      # IAM token. The function receives PG_DATABASE_URL (no password) and
      # its execution role may connect as admin.
      - binding: PG
        driver: postgres
      # An Aurora Serverless v2 PostgreSQL cluster inside NET, scaling to
      # zero when idle, its master password managed by Secrets Manager. The
      # function receives SQL_DATABASE_URL, password included, as a
      # credential resolved when its environment is built. Minutes to
      # create and delete.
      - binding: SQL
        driver: postgres
        engine: aurora
        network: NET
    # An ElastiCache Serverless cache (Valkey, redis protocol) inside NET,
    # behind a security group admitting the VPC. The function receives
    # CACHE_REDIS_URL and, running inside NET, can reach it.
    keyvalue:
      - { binding: CACHE, driver: redis, network: NET }
    # Native AWS resources: any AWS-published CloudFormation type, with its
    # own properties, validated against its schema at plan time. The log
    # group is found by its name, the queue by kraai's tag.
    aws:
      - binding: LOGS
        type: AWS::Logs::LogGroup
        properties:
          RetentionInDays: 14
      - binding: DLQ
        type: AWS::SQS::Queue
        properties:
          MessageRetentionPeriod: 1209600
      # An alarm on the JOBS queue's backlog. ${JOBS.QueueName} is what the
      # queue published, so the alarm is planned after it.
      - binding: BACKLOG
        type: AWS::CloudWatch::Alarm
        properties:
          Namespace: AWS/SQS
          MetricName: ApproximateNumberOfMessagesVisible
          Dimensions:
            - Name: QueueName
              Value: ${JOBS.QueueName}
          Statistic: Maximum
          Period: 300
          EvaluationPeriods: 1
          Threshold: 100
          ComparisonOperator: GreaterThanThreshold
