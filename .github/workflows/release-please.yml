name: release-please

# Push to main only. This is the same trust boundary the rest of this
# repo's workflows follow: a ref an external contributor cannot push to,
# so a fork's code never runs with the write permissions below in scope.
on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    steps:
      # release-please reads Conventional Commit messages (feat:, fix:,
      # etc.) since the last release. On every push to main it opens or
      # updates a "release PR" that bumps package.json and CHANGELOG.md.
      # Merging that PR is what actually cuts a release: this same action
      # then tags it, and that tag push is what triggers release.yml to
      # build, sign and publish the binaries.
      #
      # token is explicitly a PAT, not the default GITHUB_TOKEN: GitHub
      # does not run other workflows in response to a push made with the
      # repo's own GITHUB_TOKEN (push/tag/release events included, not
      # just pull_request). Verified live — the default token tagged
      # v0.1.1 successfully but publish.yml never ran. A token backed by
      # a real identity doesn't have that restriction.
      #
      # No `release-type` input here on purpose. Setting it switches the
      # action into single-package mode and release-please-config.json is
      # never read, which silently drops bump-minor-pre-major: the first
      # `feat!:` commit produced a 1.0.0 release PR instead of 0.4.0.
      # Omitting it makes the action read release-please-config.json and
      # .release-please-manifest.json (its defaults), where release-type
      # and the 0.x bump rules already live.
      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          token: ${{ secrets.RELEASE_PLEASE_TOKEN }}
