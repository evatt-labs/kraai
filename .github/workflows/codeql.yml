name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Arbitrary weekly slot, offset from other scheduled workflows in this
    # repo to avoid runner contention.
    - cron: "23 4 * * 2"

permissions:
  contents: read

jobs:
  analyze:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The Go toolchain must be present before init: CodeQL's Go extractor
      # autobuilds the module, and ubuntu-latest's preinstalled Go is not
      # pinned to go.mod's version.
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      # One language, still deliberately not a matrix. `analyze` is a
      # required status check on main (branch protection); a matrix renames
      # it to `analyze (go)`, so the required context would never report
      # again and every PR would block forever on a check that no longer
      # exists. Adding a second language later means updating branch
      # protection in the same change.
      #
      # go covers cmd/ and internal/, which is now the whole repo: the
      # JavaScript CLI and the npm install wrapper are both gone.
      - uses: github/codeql-action/init@1c5b675653bb5c22dbe9b12b556ec555138e09fd # v4.38.1
        with:
          languages: go

      - uses: github/codeql-action/analyze@b96794f015dfd88f77b49b1c93e0fa7110f94c63 # v4.38.0
