name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Arbitrary weekly slot, offset from other scheduled workflows in this
    # repo to avoid runner contention.
    - cron: "23 4 * * 2"

permissions:
  contents: read

jobs:
  analyze:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The Go toolchain must be present before init: CodeQL's Go extractor
      # autobuilds the module, and ubuntu-latest's preinstalled Go is not
      # pinned to go.mod's version.
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      # Both languages in one job, deliberately not a matrix. `analyze` is a
      # required status check on main (branch protection); a matrix renames
      # it to `analyze (go)` / `analyze (javascript-typescript)`, so the
      # required context would never report again and every PR would block
      # forever on a check that no longer exists. Splitting this later means
      # updating branch protection in the same change.
      #
      # go covers cmd/ and internal/ - the actual product.
      # javascript-typescript covers npm/, the wrapper that downloads the Go
      # binary on install. Drop the JS half if npm/ ever goes too.
      - uses: github/codeql-action/init@5595ccaf912efad79be6eef63a5619ff05969be3 # v4.37.6
        with:
          languages: go,javascript-typescript

      - uses: github/codeql-action/analyze@5595ccaf912efad79be6eef63a5619ff05969be3 # v4.37.6
