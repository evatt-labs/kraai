name: live

# Applies the live fixtures to the Evatt Labs AWS account and Neon
# organization, asserts that a plan of what was applied changes nothing,
# and destroys them. Weekly and on
# demand, never on push. A run dispatched with paid also applies kci-paid,
# which adds Aurora DSQL, Aurora Serverless v2 and ElastiCache to aws-env;
# the weekly run never does. See integration/README.md. Skipped until the
# repository variable KRAAI_LIVE_ROLE_ARN names the role infra/ci-role
# makes.
#
# The environments' names are fixed (kci-free, kci-env, kci-paid), and runs
# never overlap, so what a failed run left behind is converged and destroyed
# by the next one that applies it.

on:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:
    inputs:
      paid:
        description: Also apply kci-paid, whose Aurora and ElastiCache cost money while they exist.
        type: boolean
        default: false

permissions:
  contents: read
  id-token: write

concurrency:
  group: live
  cancel-in-progress: false

jobs:
  aws:
    if: vars.KRAAI_LIVE_ROLE_ARN != ''
    runs-on: ubuntu-latest
    # A function's network interfaces can hold its group for up to about
    # twenty minutes after it is destroyed, and an Aurora cluster and its
    # instance take tens of minutes to create and delete; under the role's
    # two-hour session.
    timeout-minutes: 110
    strategy:
      fail-fast: false
      matrix:
        target: ${{ fromJSON(inputs.paid && '[{"fixture":"aws-free","env":"kci-free"},{"fixture":"aws-env","env":"kci-env"},{"fixture":"aws-env","env":"kci-paid"}]' || '[{"fixture":"aws-free","env":"kci-free"},{"fixture":"aws-env","env":"kci-env"}]') }}
    name: aws (${{ matrix.target.env }})
    env:
      KRAAI_ENV: ${{ matrix.target.env }}
      FIXTURE: integration/${{ matrix.target.fixture }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - uses: opentofu/setup-opentofu@a1320f892987e89d278cc92dc5adc984fb93aca4 # v2.0.2
        if: matrix.target.fixture == 'aws-env'
        with:
          tofu_wrapper: false
      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.KRAAI_LIVE_ROLE_ARN }}
          role-session-name: kraai-live-${{ github.run_id }}
          aws-region: us-east-1
          # The destroy can wait up to 45 minutes for a function's network
          # interfaces; it must not run on expired credentials.
          role-duration-seconds: 7200
      - name: Build kraai
        run: go build -o "$RUNNER_TEMP/kraai" ./cmd/kraai
      - name: Make the VPC
        if: matrix.target.fixture == 'aws-env'
        run: |
          set -euo pipefail
          account=$(aws sts get-caller-identity --query Account --output text)
          tofu -chdir="$FIXTURE/vpc" init -input=false -backend-config="bucket=kraai-lock-$account-us-east-1" -backend-config="key=live/$KRAAI_ENV/vpc.tfstate"
          tofu -chdir="$FIXTURE/vpc" apply -auto-approve -input=false -var "name=$KRAAI_ENV"
      - name: Apply
        run: '"$RUNNER_TEMP/kraai" apply "$KRAAI_ENV" --dir "$FIXTURE"'
      - name: Assert a plan changes nothing
        run: '"$RUNNER_TEMP/kraai" plan "$KRAAI_ENV" --dir "$FIXTURE" --detailed-exitcode'
      - name: Destroy
        if: always()
        run: '"$RUNNER_TEMP/kraai" destroy "$KRAAI_ENV" --dir "$FIXTURE"'
      - name: Destroy the VPC
        if: always() && matrix.target.fixture == 'aws-env'
        run: tofu -chdir="$FIXTURE/vpc" destroy -auto-approve -input=false -var "name=$KRAAI_ENV"

  # The live environment holds the vendors' tokens and deploys only from
  # main. It stays off the aws job: an environment changes the OIDC
  # token's subject, which the role trusts by branch.
  neon:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: live
    permissions:
      contents: read
    env:
      KRAAI_ENV: kci-neon
      FIXTURE: integration/neon
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Build kraai
        run: go build -o "$RUNNER_TEMP/kraai" ./cmd/kraai
      - name: Apply
        env:
          NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
        run: '"$RUNNER_TEMP/kraai" apply "$KRAAI_ENV" --dir "$FIXTURE"'
      - name: Assert a plan changes nothing
        env:
          NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
        run: '"$RUNNER_TEMP/kraai" plan "$KRAAI_ENV" --dir "$FIXTURE" --detailed-exitcode'
      - name: Destroy
        if: always()
        env:
          NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
        run: '"$RUNNER_TEMP/kraai" destroy "$KRAAI_ENV" --dir "$FIXTURE"'
