services:
  free:
    dir: .
    aws:
      # Network: the EC2 types a plan finds by tag.
      - binding: VPC
        type: AWS::EC2::VPC
        # Encryption controls are billed only for a VPC holding a network
        # interface, which nothing here creates.
        properties: { CidrBlock: 10.94.0.0/16, VpcEncryptionControl: { Mode: monitor } }
      - binding: IPV6
        type: AWS::EC2::VPCCidrBlock
        properties: { VpcId: "${VPC.VpcId}", AmazonProvidedIpv6CidrBlock: true }
        match: [VpcId, AmazonProvidedIpv6CidrBlock]
      - binding: IGW
        type: AWS::EC2::InternetGateway
        properties: {}
      - binding: IGW_ATTACH
        type: AWS::EC2::VPCGatewayAttachment
        properties: { VpcId: "${VPC.VpcId}", InternetGatewayId: "${IGW.InternetGatewayId}" }
        match: [VpcId]
      - binding: SUBNET_A
        type: AWS::EC2::Subnet
        properties: { VpcId: "${VPC.VpcId}", CidrBlock: 10.94.0.0/24, AvailabilityZone: us-east-1a }
      - binding: SUBNET_B
        type: AWS::EC2::Subnet
        properties: { VpcId: "${VPC.VpcId}", CidrBlock: 10.94.1.0/24, AvailabilityZone: us-east-1b }
      - binding: RT
        type: AWS::EC2::RouteTable
        properties: { VpcId: "${VPC.VpcId}", Tags: [{ Key: Name, Value: kraai-free-rt }] }
      - binding: RT_A
        type: AWS::EC2::SubnetRouteTableAssociation
        properties: { SubnetId: "${SUBNET_A.SubnetId}", RouteTableId: "${RT.RouteTableId}" }
        match: [SubnetId]
      - binding: RT_B
        type: AWS::EC2::SubnetRouteTableAssociation
        properties: { SubnetId: "${SUBNET_B.SubnetId}", RouteTableId: "${RT.RouteTableId}" }
        match: [SubnetId]
      - binding: PEER
        type: AWS::EC2::SecurityGroup
        properties: { GroupDescription: kraai integration peer, VpcId: "${VPC.VpcId}" }
      - binding: SG
        type: AWS::EC2::SecurityGroup
        # One rule of each source and destination kind, so a direct read's
        # rules can be compared with Cloud Control's on every shape. The
        # prefix lists are the AWS-managed S3 and DynamoDB lists.
        properties:
          GroupDescription: kraai integration
          VpcId: "${VPC.VpcId}"
          SecurityGroupIngress:
            - { IpProtocol: tcp, FromPort: 443, ToPort: 443, CidrIp: 10.94.0.0/16, Description: https from the vpc }
            - { IpProtocol: tcp, FromPort: 443, ToPort: 443, CidrIpv6: "::/0" }
            - { IpProtocol: tcp, FromPort: 8080, ToPort: 8080, SourceSecurityGroupId: "${PEER.GroupId}" }
            - { IpProtocol: tcp, FromPort: 443, ToPort: 443, SourcePrefixListId: pl-63a5400a }
            - { IpProtocol: "-1", CidrIp: 10.94.1.0/24 }
          SecurityGroupEgress:
            - { IpProtocol: tcp, FromPort: 443, ToPort: 443, CidrIp: 0.0.0.0/0, Description: https out }
            - { IpProtocol: tcp, FromPort: 443, ToPort: 443, CidrIpv6: "::/0" }
            - { IpProtocol: tcp, FromPort: 5432, ToPort: 5432, DestinationSecurityGroupId: "${PEER.GroupId}" }
            - { IpProtocol: tcp, FromPort: 443, ToPort: 443, DestinationPrefixListId: pl-02cd2c6b }

      # Groups that cost nothing without the clusters or caches that would
      # use them.
      - binding: DB_SUBNETS
        type: AWS::RDS::DBSubnetGroup
        properties:
          DBSubnetGroupDescription: kraai integration
          SubnetIds: ["${SUBNET_A.SubnetId}", "${SUBNET_B.SubnetId}"]
          Tags: [{ Key: team, Value: kraai }]
      - binding: CLUSTER_PARAMS
        type: AWS::RDS::DBClusterParameterGroup
        properties:
          Description: kraai integration
          Family: aurora-postgresql16
          Parameters: { timezone: UTC }
          Tags: [{ Key: team, Value: kraai }]
      - binding: CACHE_SUBNETS
        type: AWS::ElastiCache::SubnetGroup
        properties:
          Description: kraai integration
          SubnetIds: ["${SUBNET_A.SubnetId}", "${SUBNET_B.SubnetId}"]
          Tags: [{ Key: team, Value: kraai }]

      # Log groups hold no data, and a cluster with no services runs nothing.
      # Container Insights is left disabled, as enabled it bills metrics.
      - binding: LOGS
        type: AWS::Logs::LogGroup
        properties: { RetentionInDays: 14 }
      - binding: LOGS_IA
        type: AWS::Logs::LogGroup
        properties: { LogGroupClass: INFREQUENT_ACCESS }
      # Data protection is billed per GB scanned, and nothing is written. A
      # resource policy must name the log group's ARN, account included, so
      # none is set here.
      - binding: LOGS_POLICIES
        type: AWS::Logs::LogGroup
        properties:
          Tags: [{ Key: team, Value: kraai }]
          FieldIndexPolicies: [{ Fields: [requestId] }]
          DataProtectionPolicy:
            Name: kraai-integration
            Version: "2021-06-01"
            Statement:
              - Sid: audit
                DataIdentifier: ["arn:aws:dataprotection::aws:data-identifier/EmailAddress"]
                Operation: { Audit: { FindingsDestination: {} } }
              - Sid: redact
                DataIdentifier: ["arn:aws:dataprotection::aws:data-identifier/EmailAddress"]
                Operation: { Deidentify: { MaskConfig: {} } }

      # Queues are billed per request; kraai's reads fit the free tier.
      - binding: DLQ
        type: AWS::SQS::Queue
        properties: { MessageRetentionPeriod: 1209600 }
      - binding: QUEUE
        type: AWS::SQS::Queue
        properties:
          DelaySeconds: 5
          VisibilityTimeout: 60
          ReceiveMessageWaitTimeSeconds: 10
          SqsManagedSseEnabled: true
          RedrivePolicy: { deadLetterTargetArn: "${DLQ.Arn}", maxReceiveCount: 3 }
          Tags: [{ Key: team, Value: kraai }]
      - binding: FIFO
        type: AWS::SQS::Queue
        properties:
          FifoQueue: true
          ContentBasedDeduplication: true
          DeduplicationScope: messageGroup
          FifoThroughputLimit: perMessageGroupId
      - binding: CLUSTER
        type: AWS::ECS::Cluster
        properties:
          ClusterSettings: [{ Name: containerInsights, Value: disabled }]
          CapacityProviders: [FARGATE, FARGATE_SPOT]
          DefaultCapacityProviderStrategy: [{ CapacityProvider: FARGATE, Weight: 1, Base: 0 }]
          Configuration:
            ExecuteCommandConfiguration:
              Logging: OVERRIDE
              LogConfiguration: { CloudWatchLogGroupName: "${LOGS.LogGroupName}", CloudWatchEncryptionEnabled: false }

      # Types whose identifier is their ARN. A target group with no load
      # balancer is free.
      - binding: TG
        type: AWS::ElasticLoadBalancingV2::TargetGroup
        properties: { VpcId: "${VPC.VpcId}", Protocol: HTTP, Port: 8080, TargetType: ip }
      - binding: RULE
        type: AWS::Events::Rule
        # Cloud Control's handler fails with a null pointer when Name is
        # omitted, although the schema makes it optional.
        properties:
          Name: kraai-integration-rule
          State: DISABLED
          ScheduleExpression: rate(1 day)
      # A rule on a custom bus has the bus in its ARN. Nothing is published
      # to the bus, so the queue target is never invoked.
      - binding: BUS
        type: AWS::Events::EventBus
        properties: {}
      - binding: BUS_RULE
        type: AWS::Events::Rule
        properties:
          Name: kraai-integration-bus-rule
          EventBusName: "${BUS.Name}"
          Description: kraai integration
          State: ENABLED
          EventPattern: { source: [kraai.integration], detail-type: [check] }
          Tags: [{ Key: team, Value: kraai }]
          Targets:
            - Id: queue
              Arn: "${QUEUE.Arn}"
              RetryPolicy: { MaximumRetryAttempts: 2, MaximumEventAgeInSeconds: 3600 }
              DeadLetterConfig: { Arn: "${DLQ.Arn}" }
              InputTransformer:
                InputPathsMap: { kind: $.detail-type }
                InputTemplate: '{"kind": <kind>}'
      - binding: TASK
        type: AWS::ECS::TaskDefinition
        properties:
          RequiresCompatibilities: [FARGATE]
          NetworkMode: awsvpc
          Cpu: "256"
          Memory: "512"
          ContainerDefinitions:
            - { Name: noop, Image: public.ecr.aws/docker/library/busybox:stable, Essential: true }

      # A prompt router costs nothing to create or keep: Bedrock bills per
      # request routed through it, and nothing is. Cloud Control's list
      # omits routers created in the account, so kraai lists them through
      # Bedrock itself. Foundation model ARNs carry no account.
      - binding: ROUTER
        type: AWS::Bedrock::IntelligentPromptRouter
        properties:
          PromptRouterName: kraai-integration-router
          Models:
            - { ModelArn: "arn:aws:bedrock:us-east-1::foundation-model/amazon.nova-lite-v1:0" }
            - { ModelArn: "arn:aws:bedrock:us-east-1::foundation-model/amazon.nova-pro-v1:0" }
          FallbackModel: { ModelArn: "arn:aws:bedrock:us-east-1::foundation-model/amazon.nova-pro-v1:0" }
          RoutingCriteria: { ResponseQualityDifference: 0 }
