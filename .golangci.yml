# `standard` is golangci-lint's own default set (govet, errcheck, staticcheck,
# unused, ineffassign, and a handful more) — a deliberately small addition on
# top of it for now; revisit as internal/ fills in and real patterns emerge.
# Coverage-as-a-number isn't the goal, meaningful checks are — the same
# principle applies to lint scope creep.
version: "2"

run:
  timeout: 5m

linters:
  default: standard
  enable:
    - bodyclose
    - forbidigo
    - gocritic
    - gosec
    - revive
  settings:
    forbidigo:
      # Only cmd/kraai's centralized handler may call os.Exit, print error
      # output straight to stdout/stderr, or read env vars. Every other
      # package returns errors instead.
      #
      # forbidigo matches a call's selector expression only (e.g.
      # "os.Getenv"), not its argument literals, so it can't target
      # `os.Getenv("KRAAI_DEBUG")` specifically without also matching every
      # other os.Getenv call — verified empirically against this repo's
      # golangci-lint v2.13.2. Forbidding os.Getenv outright outside
      # cmd/kraai is the achievable version of "only cmd/kraai reads
      # KRAAI_DEBUG".
      #
      # internal/env is the revisit this note invited. Provider credentials
      # (CLOUDFLARE_API_TOKEN, NEON_API_KEY) genuinely come from the
      # environment, and centralizing env access in one package satisfies
      # that better than spreading os.Getenv across every provider. It is
      # excluded below for that reason, not waived.
      forbid:
        - pattern: '^os\.Exit$'
          msg: "os.Exit is only allowed in cmd/kraai's centralized handler."
        - pattern: '^fmt\.Print(f|ln)?$'
          msg: "fmt.Print/Printf/Println write straight to stdout; only cmd/kraai presents output this way."
        - pattern: '^os\.Getenv$'
          msg: "env vars (KRAAI_DEBUG included) are read only by cmd/kraai's centralized handler."
  exclusions:
    rules:
      - path: ^cmd/kraai/
        linters:
          - forbidigo
      # See the forbidigo note above: this package is the centralized env
      # reader, so reading the environment is its entire purpose.
      - path: ^internal/env/
        linters:
          - forbidigo

formatters:
  enable:
    - gofmt
    - goimports
