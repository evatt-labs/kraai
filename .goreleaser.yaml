# GoReleaser config for kraai. Driven by .github/workflows/release.yml on a
# v* tag push; validate changes locally with
# `goreleaser release --snapshot --clean --skip=sign`, since keyless signing
# needs an OIDC identity that only exists inside a real Actions run.
version: 2

project_name: kraai

before:
  hooks:
    - go mod tidy

builds:
  - id: kraai
    main: ./cmd/kraai
    binary: kraai
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w
      - -X github.com/evatt-labs/kraai/internal/cli.version={{ .Version }}
      - -X github.com/evatt-labs/kraai/internal/cli.commit={{ .Commit }}
      - -X github.com/evatt-labs/kraai/internal/cli.date={{ .Date }}

archives:
  - id: kraai-archive
    formats: [tar.gz]
    name_template: >-
      {{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}

checksum:
  name_template: checksums.txt

# Keyless cosign signing (Sigstore, OIDC-based — no key material stored in
# this repo). config.Sign has no per-run `skip` field, so this pipe always
# runs when GoReleaser executes; the release workflow installs cosign and
# grants `id-token: write` for it. Outside Actions there is no OIDC identity,
# so a local run needs `--skip=sign`.
#
# One bundle, not a separate .sig and .pem. cosign v3 defaults to the new
# bundle format, which carries the signature, the certificate and the
# transparency-log entry in one file and ignores --output-signature and
# --output-certificate entirely. Passing those alone leaves --bundle empty
# and cosign fails trying to write to "".
#
# Verify a release with:
#   cosign verify-blob checksums.txt \
#     --bundle checksums.txt.bundle \
#     --certificate-identity-regexp '^https://github.com/evatt-labs/kraai/' \
#     --certificate-oidc-issuer https://token.actions.githubusercontent.com
signs:
  - id: checksums
    cmd: cosign
    signature: "${artifact}.bundle"
    args:
      - sign-blob
      - "--bundle=${signature}"
      - "${artifact}"
      - --yes
    artifacts: checksum

release:
  github:
    owner: evatt-labs
    name: kraai
  # GoReleaser defaults this to false, which marks every tag as the latest
  # release — a v0.6.0-rc.1 would be offered as the recommended download
  # ahead of the last stable one. "auto" reads the semver prerelease
  # segment, so anything with a -rc, -beta or -alpha suffix is published as
  # a prerelease and leaves the stable release alone.
  prerelease: auto
