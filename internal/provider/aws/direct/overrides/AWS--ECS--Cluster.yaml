type: AWS::ECS::Cluster
read:
  model: ecs/service/2014-11-13/ecs-2014-11-13.json
  operation: DescribeClusters
  identifier:
    ClusterName: clusters
  # DescribeClusters filters by a list of names or ARNs and answers with a
  # list.
  response: clusters[]
  # Tags, settings and configuration are returned only when asked for.
  input:
    include: [TAGS, SETTINGS, CONFIGURATIONS]
  # A deleted cluster is still describable for a while; Cloud Control reads
  # it as gone.
  absent:
    status: [INACTIVE]
  # Capacity providers attach after the call that sets them returns; until
  # they do, the cluster refuses every further change, delete included.
  busy:
    attachmentsStatus: [UPDATE_IN_PROGRESS]
  # Tags are addressed by the ARN, which a mutation takes from the read.
  capture:
    Arn: clusterArn
properties:
  Arn: clusterArn
  CapacityProviders: capacityProviders
  ClusterName: clusterName
  ClusterSettings:
    member: settings
    properties:
      Name: name
      Value: value
  Configuration:
    member: configuration
    properties:
      ExecuteCommandConfiguration:
        member: executeCommandConfiguration
        properties:
          KmsKeyId: kmsKeyId
          Logging: logging
          LogConfiguration:
            member: logConfiguration
            properties:
              CloudWatchEncryptionEnabled: cloudWatchEncryptionEnabled
              CloudWatchLogGroupName: cloudWatchLogGroupName
              S3BucketName: s3BucketName
              S3EncryptionEnabled: s3EncryptionEnabled
              S3KeyPrefix: s3KeyPrefix
      ManagedStorageConfiguration:
        member: managedStorageConfiguration
        properties:
          FargateEphemeralStorageKmsKeyId: fargateEphemeralStorageKmsKeyId
          KmsKeyId: kmsKeyId
  DefaultCapacityProviderStrategy:
    member: defaultCapacityProviderStrategy
    properties:
      Base: base
      CapacityProvider: capacityProvider
      Weight: weight
  Tags:
    member: tags
    properties:
      Key: key
      Value: value
create:
  operation: CreateCluster
  name:
    property: ClusterName
    tag: kraai:resource-name
  input:
    clusterName: "{ClusterName}"
    capacityProviders: "{CapacityProviders}"
    configuration: "{Configuration:wire}"
    defaultCapacityProviderStrategy: "{DefaultCapacityProviderStrategy:wire}"
    settings: "{ClusterSettings:wire}"
    tags: "{Tags:wire}"
    # Write-only, so never read back: sent by its one property.
    serviceConnectDefaults:
      namespace: "{ServiceConnectDefaults.Namespace}"
  identifier:
    ClusterName: cluster.clusterName
update:
  - operation: UpdateClusterSettings
    retryErrors: [UpdateInProgressException]
    properties: [ClusterSettings]
    input:
      cluster: "{ClusterName}"
      settings: "{ClusterSettings:wire}"
  - operation: UpdateCluster
    retryErrors: [UpdateInProgressException]
    properties: [Configuration]
    input:
      cluster: "{ClusterName}"
      configuration: "{Configuration:wire}"
  # The call requires both, and replaces both.
  - operation: PutClusterCapacityProviders
    retryErrors: [UpdateInProgressException]
    properties: [CapacityProviders, DefaultCapacityProviderStrategy]
    together: true
    input:
      cluster: "{ClusterName}"
      capacityProviders: "{CapacityProviders}"
      defaultCapacityProviderStrategy: "{DefaultCapacityProviderStrategy:wire}"
  - tags:
      property: Tags
      add:
        operation: TagResource
        input:
          resourceArn: "{Arn}"
          tags: "{added:wire}"
      remove:
        operation: UntagResource
        input:
          resourceArn: "{Arn}"
          tagKeys: "{removed}"
# A deleted cluster reads as INACTIVE, which is absent.
delete:
  operation: DeleteCluster
  input:
    cluster: "{ClusterName}"
  absentErrors: [ClusterNotFoundException]
  # A cluster busy with a change made elsewhere is waited out.
  retryErrors: [UpdateInProgressException]
# Container Insights bills metrics once enabled, so the settings are only
# ever set disabled. A Service Connect namespace would be left in Cloud Map
# after the cluster, so ServiceConnectDefaults is not exercised.
lifecycle:
  create:
    CapacityProviders: [FARGATE]
    DefaultCapacityProviderStrategy: [{CapacityProvider: FARGATE, Weight: 1, Base: 0}]
  update:
    CapacityProviders: [FARGATE, FARGATE_SPOT]
    ClusterSettings: [{Name: containerInsights, Value: disabled}]
    Configuration:
      ExecuteCommandConfiguration:
        Logging: DEFAULT
    DefaultCapacityProviderStrategy: [{CapacityProvider: FARGATE_SPOT, Weight: 1, Base: 0}]
    Tags: [{Key: team, Value: kraai}]
absentIds:
  - kraai-nonexistent-cluster-zzz
