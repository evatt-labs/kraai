type: AWS::SQS::Queue
read:
  model: sqs/service/2012-11-05/sqs-2012-11-05.json
  operation: GetQueueAttributes
  absentErrors: [QueueDoesNotExist]
  identifier:
    QueueUrl: QueueUrl
  input:
    AttributeNames: [All]
properties:
  # The response is one map of attribute names to strings; the URL itself
  # is not in it.
  QueueUrl: "{QueueUrl}"
  Arn: Attributes.QueueArn
  QueueName:
    member: Attributes.QueueArn
    transform: arnResource
  DeduplicationScope: Attributes.DeduplicationScope
  FifoThroughputLimit: Attributes.FifoThroughputLimit
  KmsMasterKeyId: Attributes.KmsMasterKeyId
  ContentBasedDeduplication:
    member: Attributes.ContentBasedDeduplication
    transform: boolean
  FifoQueue:
    member: Attributes.FifoQueue
    transform: boolean
  SqsManagedSseEnabled:
    member: Attributes.SqsManagedSseEnabled
    transform: boolean
  DelaySeconds:
    member: Attributes.DelaySeconds
    transform: number
  KmsDataKeyReusePeriodSeconds:
    member: Attributes.KmsDataKeyReusePeriodSeconds
    transform: number
  MaximumMessageSize:
    member: Attributes.MaximumMessageSize
    transform: number
  MessageRetentionPeriod:
    member: Attributes.MessageRetentionPeriod
    transform: number
  ReceiveMessageWaitTimeSeconds:
    member: Attributes.ReceiveMessageWaitTimeSeconds
    transform: number
  VisibilityTimeout:
    member: Attributes.VisibilityTimeout
    transform: number
  RedriveAllowPolicy:
    member: Attributes.RedriveAllowPolicy
    transform: json
  RedrivePolicy:
    member: Attributes.RedrivePolicy
    transform: json
also:
  - operation: ListQueueTags
    identifier:
      QueueUrl: QueueUrl
    properties:
      Tags:
        member: Tags
        entries: [Key, Value]
create:
  operation: CreateQueue
  # A queue is named by kraai's identity tag, so a retried create names the
  # queue it made; the name cannot be reused for a minute after a delete.
  name:
    property: QueueName
    tag: kraai:resource-name
  input:
    QueueName: "{QueueName}"
    Attributes:
      ContentBasedDeduplication: "{ContentBasedDeduplication:string}"
      DeduplicationScope: "{DeduplicationScope}"
      DelaySeconds: "{DelaySeconds:string}"
      FifoQueue: "{FifoQueue:string}"
      FifoThroughputLimit: "{FifoThroughputLimit}"
      KmsDataKeyReusePeriodSeconds: "{KmsDataKeyReusePeriodSeconds:string}"
      KmsMasterKeyId: "{KmsMasterKeyId}"
      MaximumMessageSize: "{MaximumMessageSize:string}"
      MessageRetentionPeriod: "{MessageRetentionPeriod:string}"
      ReceiveMessageWaitTimeSeconds: "{ReceiveMessageWaitTimeSeconds:string}"
      RedriveAllowPolicy: "{RedriveAllowPolicy:json}"
      RedrivePolicy: "{RedrivePolicy:json}"
      SqsManagedSseEnabled: "{SqsManagedSseEnabled:string}"
      VisibilityTimeout: "{VisibilityTimeout:string}"
    tags: "{Tags:entries}"
  # A name deleted in the last minute is held; the create is retried.
  retryErrors: [QueueDeletedRecently]
  identifier:
    QueueUrl: QueueUrl
update:
  - operation: SetQueueAttributes
    properties: [ContentBasedDeduplication, DeduplicationScope, DelaySeconds, FifoThroughputLimit, KmsDataKeyReusePeriodSeconds, KmsMasterKeyId, MaximumMessageSize, MessageRetentionPeriod, ReceiveMessageWaitTimeSeconds, RedriveAllowPolicy, RedrivePolicy, SqsManagedSseEnabled, VisibilityTimeout]
    input:
      QueueUrl: "{QueueUrl}"
      Attributes:
        ContentBasedDeduplication: "{ContentBasedDeduplication:string}"
        DeduplicationScope: "{DeduplicationScope}"
        DelaySeconds: "{DelaySeconds:string}"
        FifoThroughputLimit: "{FifoThroughputLimit}"
        KmsDataKeyReusePeriodSeconds: "{KmsDataKeyReusePeriodSeconds:string}"
        KmsMasterKeyId: "{KmsMasterKeyId}"
        MaximumMessageSize: "{MaximumMessageSize:string}"
        MessageRetentionPeriod: "{MessageRetentionPeriod:string}"
        ReceiveMessageWaitTimeSeconds: "{ReceiveMessageWaitTimeSeconds:string}"
        RedriveAllowPolicy: "{RedriveAllowPolicy:json}"
        RedrivePolicy: "{RedrivePolicy:json}"
        SqsManagedSseEnabled: "{SqsManagedSseEnabled:string}"
        VisibilityTimeout: "{VisibilityTimeout:string}"
  - tags:
      property: Tags
      add:
        operation: TagQueue
        input:
          QueueUrl: "{QueueUrl}"
          Tags: "{added:entries}"
      remove:
        operation: UntagQueue
        input:
          QueueUrl: "{QueueUrl}"
          TagKeys: "{removed}"
delete:
  operation: DeleteQueue
  input:
    QueueUrl: "{QueueUrl}"
  absentErrors: [QueueDoesNotExist]
# FIFO-only settings, a key's reuse period and a redrive to another queue
# need a FIFO queue, a key or a second queue, which the harness does not
# make; they are routed but not exercised.
lifecycle:
  create:
    DelaySeconds: 1
    VisibilityTimeout: 40
  update:
    DelaySeconds: 3
    MaximumMessageSize: 2048
    MessageRetentionPeriod: 7200
    ReceiveMessageWaitTimeSeconds: 5
    RedriveAllowPolicy: {redrivePermission: denyAll}
    SqsManagedSseEnabled: false
    Tags: [{Key: team, Value: kraai}]
    VisibilityTimeout: 50
absentIds:
  - https://sqs.{region}.amazonaws.com/{account}/kraai-absent-probe
