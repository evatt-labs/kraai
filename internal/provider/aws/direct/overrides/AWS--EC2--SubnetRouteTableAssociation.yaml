type: AWS::EC2::SubnetRouteTableAssociation
read:
  model: ec2/service/2016-11-15/ec2-2016-11-15.json
  operation: DescribeRouteTables
  # The association is found through the route table holding it.
  input:
    Filters:
      - Name: association.route-table-association-id
        Values: ["{Id}"]
  response: RouteTables[]
  # A route table's main association belongs to no subnet; Cloud Control
  # reads it as absent.
  absent:
    Associations[RouteTableAssociationId={Id}].Main: ["true"]
  # A new association answers associating until it is in effect. Only a
  # delete leaves it disassociating, and that waits for absence instead.
  busy:
    Associations[RouteTableAssociationId={Id}].AssociationState.State: [associating]
properties:
  Id: Associations[RouteTableAssociationId={Id}].RouteTableAssociationId
  RouteTableId: RouteTableId
  SubnetId: Associations[RouteTableAssociationId={Id}].SubnetId
create:
  operation: AssociateRouteTable
  input:
    RouteTableId: "{RouteTableId}"
    SubnetId: "{SubnetId}"
  identifier:
    Id: AssociationId
delete:
  operation: DisassociateRouteTable
  input:
    AssociationId: "{Id}"
  absentErrors: [InvalidAssociationID.NotFound]
lifecycle:
  create:
    RouteTableId: "{routeTableId}"
    # A subnet has at most one explicit association, so the harness gets
    # one of its own.
    SubnetId: "{subnetIdC}"
  update: {}
absentIds:
  - rtbassoc-0a1b2c3d4e5f60718
undeclaredErrors:
  InvalidAssociationID.NotFound: EC2's model declares no errors. DisassociateRouteTable answers it for an association that does not exist.
