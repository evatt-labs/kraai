type: AWS::Lambda::Function
read:
  model: lambda/service/2015-03-31/lambda-2015-03-31.json
  operation: GetFunction
  identifier:
    FunctionName: FunctionName
  response: Configuration
  absentErrors: [ResourceNotFoundException]
  # Each change is refused while another is settling.
  busy:
    State: [Pending]
    LastUpdateStatus: [InProgress]
  capture:
    Arn: FunctionArn
properties:
  Architectures: Architectures
  Arn: FunctionArn
  CapacityProviderConfig:
    member: CapacityProviderConfig
    properties:
      LambdaManagedInstancesCapacityProviderConfig:
        member: LambdaManagedInstancesCapacityProviderConfig
        properties:
          CapacityProviderArn: CapacityProviderArn
          ExecutionEnvironmentMemoryGiBPerVCpu: ExecutionEnvironmentMemoryGiBPerVCpu
          PerExecutionEnvironmentMaxConcurrency: PerExecutionEnvironmentMaxConcurrency
  DeadLetterConfig:
    member: DeadLetterConfig
    properties:
      TargetArn: TargetArn
  Description: Description
  DurableConfig:
    member: DurableConfig
    properties:
      ExecutionTimeout: ExecutionTimeout
      KMSKeyArn: KMSKeyArn
      RetentionPeriodInDays: RetentionPeriodInDays
  Environment:
    member: Environment
    properties:
      Variables: Variables
  EphemeralStorage:
    member: EphemeralStorage
    properties:
      Size: Size
  FileSystemConfigs:
    member: FileSystemConfigs
    properties:
      Arn: Arn
      LocalMountPath: LocalMountPath
      S3FilesConfig:
        member: S3FilesConfig
        properties:
          DirectS3Read: DirectS3Read
  FunctionName: FunctionName
  Handler: Handler
  ImageConfig:
    member: ImageConfigResponse.ImageConfig
    properties:
      Command: Command
      EntryPoint: EntryPoint
      WorkingDirectory: WorkingDirectory
  KmsKeyArn: KMSKeyArn
  Layers: Layers[].Arn
  LoggingConfig:
    member: LoggingConfig
    properties:
      ApplicationLogLevel: ApplicationLogLevel
      LogFormat: LogFormat
      LogGroup: LogGroup
      SystemLogLevel: SystemLogLevel
  MemorySize: MemorySize
  PackageType: PackageType
  Role: Role
  Runtime: Runtime
  SnapStartResponse:
    member: SnapStart
    properties:
      ApplyOn: ApplyOn
      OptimizationStatus: OptimizationStatus
  # Tags and the reserved concurrency come beside the configuration.
  ReservedConcurrentExecutions: $.Concurrency.ReservedConcurrentExecutions
  Tags:
    member: $.Tags
    entries: [Key, Value]
  TenancyConfig:
    member: TenancyConfig
    properties:
      TenantIsolationMode: TenantIsolationMode
  Timeout: Timeout
  TracingConfig:
    member: TracingConfig
    properties:
      Mode: Mode
  VpcConfig:
    member: VpcConfig
    properties:
      Ipv6AllowedForDualStack: Ipv6AllowedForDualStack
      SecurityGroupIds: SecurityGroupIds
      SubnetIds: SubnetIds
also:
  - operation: GetFunctionCodeSigningConfig
    identifier:
      FunctionName: FunctionName
    properties:
      CodeSigningConfigArn: CodeSigningConfigArn
  - operation: GetFunctionRecursionConfig
    identifier:
      FunctionName: FunctionName
    properties:
      RecursiveLoop: RecursiveLoop
  - operation: GetRuntimeManagementConfig
    identifier:
      FunctionName: FunctionName
    properties:
      RuntimeManagementConfig:
        member: "."
        properties:
          RuntimeVersionArn: RuntimeVersionArn
          UpdateRuntimeOn: UpdateRuntimeOn
  # Only a function on managed instances has a scaling configuration; any
  # other answers that it does not exist.
  - operation: GetFunctionScalingConfig
    identifier:
      FunctionName: FunctionName
    input:
      Qualifier: $LATEST.PUBLISHED
    absentErrors: [ResourceNotFoundException]
    properties:
      FunctionScalingConfig:
        member: RequestedFunctionScalingConfig
        properties:
          MaxExecutionEnvironments: MaxExecutionEnvironments
          MinExecutionEnvironments: MinExecutionEnvironments
absentIds:
  - kraai-nonexistent-function-zzz
# A function in a VPC holds Pending for minutes while its network
# interfaces are made.
wait: 15m
create:
  operation: CreateFunction
  # A role made moments before is refused until Lambda can assume it.
  retryErrors:
    - ResourceConflictException
    - "InvalidParameterValueException: cannot be assumed by Lambda"
  input:
    FunctionName: "{FunctionName}"
    Runtime: "{Runtime}"
    Role: "{Role}"
    Handler: "{Handler}"
    Code: "{Code}"
    Description: "{Description}"
    Timeout: "{Timeout}"
    MemorySize: "{MemorySize}"
    VpcConfig: "{VpcConfig:wire}"
    PackageType: "{PackageType}"
    DeadLetterConfig: "{DeadLetterConfig:wire}"
    Environment: "{Environment:wire}"
    KMSKeyArn: "{KmsKeyArn}"
    TracingConfig: "{TracingConfig:wire}"
    Tags: "{Tags:entries}"
    Layers: "{Layers}"
    FileSystemConfigs: "{FileSystemConfigs:wire}"
    CodeSigningConfigArn: "{CodeSigningConfigArn}"
    ImageConfig: "{ImageConfig}"
    Architectures: "{Architectures}"
    EphemeralStorage: "{EphemeralStorage:wire}"
    SnapStart: "{SnapStart}"
    LoggingConfig: "{LoggingConfig:wire}"
    TenancyConfig: "{TenancyConfig:wire}"
  identifier:
    FunctionName: FunctionName
update:
  - operation: UpdateFunctionConfiguration
    retryErrors: [ResourceConflictException]
    properties: [Role, Handler, Description, Timeout, MemorySize, VpcConfig, Environment, Runtime,
      DeadLetterConfig, KmsKeyArn, TracingConfig, Layers, FileSystemConfigs, ImageConfig,
      EphemeralStorage, SnapStart, LoggingConfig]
    input:
      FunctionName: "{FunctionName}"
      Role: "{Role}"
      Handler: "{Handler}"
      Description: "{Description}"
      Timeout: "{Timeout}"
      MemorySize: "{MemorySize}"
      VpcConfig: "{VpcConfig:wire}"
      Environment: "{Environment:wire}"
      Runtime: "{Runtime}"
      DeadLetterConfig: "{DeadLetterConfig:wire}"
      KMSKeyArn: "{KmsKeyArn}"
      TracingConfig: "{TracingConfig:wire}"
      Layers: "{Layers}"
      FileSystemConfigs: "{FileSystemConfigs:wire}"
      ImageConfig: "{ImageConfig}"
      EphemeralStorage: "{EphemeralStorage:wire}"
      SnapStart: "{SnapStart}"
      LoggingConfig: "{LoggingConfig:wire}"
  # Code is never read back, so every update sends it again; the
  # architecture is set with it.
  - operation: UpdateFunctionCode
    retryErrors: [ResourceConflictException]
    properties: [Code, Architectures]
    input:
      FunctionName: "{FunctionName}"
      S3Bucket: "{Code.S3Bucket}"
      S3Key: "{Code.S3Key}"
      S3ObjectVersion: "{Code.S3ObjectVersion}"
      S3ObjectStorageMode: "{Code.S3ObjectStorageMode}"
      ImageUri: "{Code.ImageUri}"
      SourceKMSKeyArn: "{Code.SourceKMSKeyArn}"
      Architectures: "{Architectures}"
  - operation: PutFunctionConcurrency
    retryErrors: [ResourceConflictException]
    properties: [ReservedConcurrentExecutions]
    input:
      FunctionName: "{FunctionName}"
      ReservedConcurrentExecutions: "{ReservedConcurrentExecutions}"
  - operation: PutFunctionRecursionConfig
    retryErrors: [ResourceConflictException]
    properties: [RecursiveLoop]
    input:
      FunctionName: "{FunctionName}"
      RecursiveLoop: "{RecursiveLoop}"
  - operation: PutRuntimeManagementConfig
    retryErrors: [ResourceConflictException]
    properties: [RuntimeManagementConfig]
    input:
      FunctionName: "{FunctionName}"
      UpdateRuntimeOn: "{RuntimeManagementConfig.UpdateRuntimeOn}"
      RuntimeVersionArn: "{RuntimeManagementConfig.RuntimeVersionArn}"
  - operation: PutFunctionCodeSigningConfig
    retryErrors: [ResourceConflictException]
    properties: [CodeSigningConfigArn]
    input:
      FunctionName: "{FunctionName}"
      CodeSigningConfigArn: "{CodeSigningConfigArn}"
  - tags:
      property: Tags
      add:
        operation: TagResource
        retryErrors: [ResourceConflictException]
        input:
          Resource: "{Arn}"
          Tags: "{added:entries}"
      remove:
        operation: UntagResource
        retryErrors: [ResourceConflictException]
        input:
          Resource: "{Arn}"
          TagKeys: "{removed}"
delete:
  operation: DeleteFunction
  retryErrors: [ResourceConflictException]
  input:
    FunctionName: "{FunctionName}"
  absentErrors: [ResourceNotFoundException]
unsupported:
  Code.ZipFile: inline source is zipped by Cloud Control; the API takes the zip itself
  CapacityProviderConfig: runs on Lambda managed instances, which no direct evidence covers
  FunctionScalingConfig: set on the published version of a function on managed instances
  PublishToLatestPublished: publishes a version for managed instances
  DurableConfig: replaces the function when some of its members change, which no direct evidence covers
lifecycle:
  create:
    FunctionName: "{name}"
    Runtime: python3.13
    Handler: index.handler
    Role: "{functionRoleArn}"
    Code:
      S3Bucket: "{artifactBucket}"
      S3Key: lifecycle/handler-1.zip
    MemorySize: 128
    Timeout: 3
    Environment:
      Variables:
        STAGE: one
    Tags:
      - Key: kraai-lifecycle-stage
        Value: one
  update:
    Code:
      S3Bucket: "{artifactBucket}"
      S3Key: lifecycle/handler-2.zip
    Description: updated by the lifecycle harness
    Timeout: 5
    Environment:
      Variables:
        STAGE: two
        EXTRA: "yes"
    ReservedConcurrentExecutions: 1
    RecursiveLoop: Allow
    Tags:
      - Key: kraai-lifecycle-stage
        Value: two
