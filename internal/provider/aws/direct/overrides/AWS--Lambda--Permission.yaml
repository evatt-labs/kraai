type: AWS::Lambda::Permission
read:
  model: lambda/service/2015-03-31/lambda-2015-03-31.json
  operation: GetPolicy
  # The identifier is the function, as named when the permission was made,
  # then the statement's ID: the one policy holds every statement of a
  # function (or of one of its aliases or versions, when named with it), and
  # the ID selects this one.
  identifier:
    FunctionName: FunctionName
  absentErrors: [ResourceNotFoundException]
properties:
  FunctionName: "{FunctionName}"
  # The policy is one JSON document in a string. A statement that is not in
  # it is a permission that is gone.
  Id:
    member: Policy
    extract: ["Statement[Sid={Id}].Sid"]
  Action:
    member: Policy
    extract: ["Statement[Sid={Id}].Action"]
  # A service principal is a Service, an account an AWS principal, and the
  # wildcard a bare string.
  Principal:
    member: Policy
    extract: ["Statement[Sid={Id}].Principal.Service", "Statement[Sid={Id}].Principal.AWS", "Statement[Sid={Id}].Principal"]
  SourceArn:
    member: Policy
    extract: ["Statement[Sid={Id}].Condition.ArnLike.AWS:SourceArn"]
  SourceAccount:
    member: Policy
    extract: ["Statement[Sid={Id}].Condition.StringEquals.AWS:SourceAccount"]
  PrincipalOrgID:
    member: Policy
    extract: ["Statement[Sid={Id}].Condition.StringEquals.aws:PrincipalOrgID"]
  EventSourceToken:
    member: Policy
    extract: ["Statement[Sid={Id}].Condition.StringEquals.lambda:EventSourceToken"]
  FunctionUrlAuthType:
    member: Policy
    extract: ["Statement[Sid={Id}].Condition.StringEquals.lambda:FunctionUrlAuthType"]
  InvokedViaFunctionUrl:
    member: Policy
    extract: ["Statement[Sid={Id}].Condition.Bool.lambda:InvokedViaFunctionUrl"]
    transform: boolean
create:
  operation: AddPermission
  # The statement ID is the caller's to name, and the schema reads it only.
  generate: [Id]
  # An account ID is read back as that account's root ARN.
  unechoed: [Principal]
  input:
    FunctionName: "{FunctionName}"
    StatementId: "{Id}"
    Action: "{Action}"
    Principal: "{Principal}"
    SourceArn: "{SourceArn}"
    SourceAccount: "{SourceAccount}"
    PrincipalOrgID: "{PrincipalOrgID}"
    EventSourceToken: "{EventSourceToken}"
    FunctionUrlAuthType: "{FunctionUrlAuthType}"
    InvokedViaFunctionUrl: "{InvokedViaFunctionUrl}"
  # Changes to one function's policy are made one at a time.
  retryErrors: [ResourceConflictException]
  identifier:
    FunctionName: "{FunctionName}"
    Id: "{Id}"
delete:
  operation: RemovePermission
  input:
    FunctionName: "{FunctionName}"
    StatementId: "{Id}"
  absentErrors: [ResourceNotFoundException]
  retryErrors: [ResourceConflictException]
# Every property is create-only. The vector's principal is a service with a
# source in this account, never a wildcard, on a function the harness made.
lifecycle:
  create:
    FunctionName: "{functionName}"
    Action: lambda:InvokeFunction
    Principal: events.amazonaws.com
    SourceArn: arn:aws:events:{region}:{account}:rule/{name}
    SourceAccount: "{account}"
  update: {}
absentIds:
  - kraai-absent-probe|kraai-absent-statement
