type: AWS::Events::Rule
read:
  model: eventbridge/service/2015-10-07/eventbridge-2015-10-07.json
  operation: DescribeRule
  absentErrors: [ResourceNotFoundException]
  # The identifier is the rule's ARN, arn:...:rule/[bus/]name; DescribeRule
  # takes the name and, for a custom bus, the bus.
  input:
    Name: "{Arn:arnName}"
    EventBusName: "{Arn:arnParent}"
properties:
  Arn: Arn
  Description: Description
  EventBusName: EventBusName
  EventPattern:
    member: EventPattern
    transform: json
  Name: Name
  RoleArn: RoleArn
  RuleName: Name
  ScheduleExpression: ScheduleExpression
  State: State
also:
  - operation: ListTargetsByRule
    input:
      Rule: "{Arn:arnName}"
      EventBusName: "{Arn:arnParent}"
    properties:
      Targets:
        member: Targets
        properties:
          AppSyncParameters:
            member: AppSyncParameters
            properties:
              GraphQLOperation: GraphQLOperation
          Arn: Arn
          BatchParameters:
            member: BatchParameters
            properties:
              ArrayProperties:
                member: ArrayProperties
                properties:
                  Size: Size
              JobDefinition: JobDefinition
              JobName: JobName
              RetryStrategy:
                member: RetryStrategy
                properties:
                  Attempts: Attempts
          DeadLetterConfig:
            member: DeadLetterConfig
            properties:
              Arn: Arn
          EcsParameters:
            member: EcsParameters
            properties:
              CapacityProviderStrategy:
                member: CapacityProviderStrategy
                properties:
                  Base: base
                  CapacityProvider: capacityProvider
                  Weight: weight
              EnableECSManagedTags: EnableECSManagedTags
              EnableExecuteCommand: EnableExecuteCommand
              Group: Group
              LaunchType: LaunchType
              NetworkConfiguration:
                member: NetworkConfiguration
                properties:
                  AwsVpcConfiguration:
                    member: awsvpcConfiguration
                    properties:
                      AssignPublicIp: AssignPublicIp
                      SecurityGroups: SecurityGroups
                      Subnets: Subnets
              PlacementConstraints:
                member: PlacementConstraints
                properties:
                  Expression: expression
                  Type: type
              PlacementStrategies:
                member: PlacementStrategy
                properties:
                  Field: field
                  Type: type
              PlatformVersion: PlatformVersion
              PropagateTags: PropagateTags
              ReferenceId: ReferenceId
              TagList:
                member: Tags
                properties:
                  Key: Key
                  Value: Value
              TaskCount: TaskCount
              TaskDefinitionArn: TaskDefinitionArn
          HttpParameters:
            member: HttpParameters
            properties:
              HeaderParameters: HeaderParameters
              PathParameterValues: PathParameterValues
              QueryStringParameters: QueryStringParameters
          Id: Id
          Input: Input
          InputPath: InputPath
          InputTransformer:
            member: InputTransformer
            properties:
              InputPathsMap: InputPathsMap
              InputTemplate: InputTemplate
          KinesisParameters:
            member: KinesisParameters
            properties:
              PartitionKeyPath: PartitionKeyPath
          RedshiftDataParameters:
            member: RedshiftDataParameters
            properties:
              Database: Database
              DbUser: DbUser
              SecretManagerArn: SecretManagerArn
              Sql: Sql
              Sqls: Sqls
              StatementName: StatementName
              WithEvent: WithEvent
          RetryPolicy:
            member: RetryPolicy
            properties:
              MaximumEventAgeInSeconds: MaximumEventAgeInSeconds
              MaximumRetryAttempts: MaximumRetryAttempts
          RoleArn: RoleArn
          RunCommandParameters:
            member: RunCommandParameters
            properties:
              RunCommandTargets:
                member: RunCommandTargets
                properties:
                  Key: Key
                  Values: Values
          SageMakerPipelineParameters:
            member: SageMakerPipelineParameters
            properties:
              PipelineParameterList:
                member: PipelineParameterList
                properties:
                  Name: Name
                  Value: Value
          SqsParameters:
            member: SqsParameters
            properties:
              MessageGroupId: MessageGroupId
  - operation: ListTagsForResource
    identifier:
      Arn: ResourceARN
    properties:
      Tags:
        member: Tags
        properties:
          Key: Key
          Value: Value
create:
  operation: PutRule
  name:
    property: Name
    tag: kraai:resource-name
  input:
    Name: "{Name}"
    EventBusName: "{EventBusName}"
    Description: "{Description}"
    EventPattern: "{EventPattern:json}"
    RoleArn: "{RoleArn}"
    ScheduleExpression: "{ScheduleExpression}"
    State: "{State}"
    Tags: "{Tags}"
  identifier:
    Arn: RuleArn
update:
  # PutRule sets every field it is not sent to null, so all of them go on
  # any change. The rule is addressed by its ARN: its name, and its bus
  # unless it is the default one.
  - operation: PutRule
    properties: [Description, EventPattern, RoleArn, ScheduleExpression, State]
    together: true
    input:
      Name: "{Arn:arnName}"
      EventBusName: "{Arn:arnParent}"
      Description: "{Description}"
      EventPattern: "{EventPattern:json}"
      RoleArn: "{RoleArn}"
      ScheduleExpression: "{ScheduleExpression}"
      State: "{State}"
  # Targets are put and removed by Id, each call answering success with a
  # count of the entries it failed.
  - list:
      property: Targets
      key: [Id]
      add:
        operation: PutTargets
        failedCount: FailedEntryCount
        input:
          Rule: "{Arn:arnName}"
          EventBusName: "{Arn:arnParent}"
          Targets: "{added:wire}"
      remove:
        operation: RemoveTargets
        failedCount: FailedEntryCount
        input:
          Rule: "{Arn:arnName}"
          EventBusName: "{Arn:arnParent}"
          Ids: "{removedKeys}"
  - tags:
      property: Tags
      add:
        operation: TagResource
        input:
          ResourceARN: "{Arn}"
          Tags: "{added}"
      remove:
        operation: UntagResource
        input:
          ResourceARN: "{Arn}"
          TagKeys: "{removed}"
# A rule with targets cannot be deleted: "Rule can't be deleted since it has
# targets." They are removed first.
delete:
  operation: DeleteRule
  input:
    Name: "{Arn:arnName}"
    EventBusName: "{Arn:arnParent}"
  absentErrors: [ResourceNotFoundException]
  clear: [Targets]
# The schema lists the bus as conditionally create-only; the rule's ARN, its
# identifier, names it.
createOnly: [EventBusName]
# The targets are a queue made for the harness: PutTargets accepts one with
# no queue policy.
lifecycle:
  create:
    Description: kraai lifecycle probe
    ScheduleExpression: rate(5 minutes)
    State: DISABLED
    Targets:
      - {Id: q1, Arn: "{queueArn}"}
      - {Id: q2, Arn: "{queueArn}"}
  update:
    Description: kraai lifecycle probe, updated
    ScheduleExpression: rate(10 minutes)
    State: ENABLED
    Tags: [{Key: team, Value: kraai}]
    Targets:
      - {Id: q1, Arn: "{queueArn}"}
absentIds:
  - arn:aws:events:{region}:{account}:rule/kraai-absent-probe
