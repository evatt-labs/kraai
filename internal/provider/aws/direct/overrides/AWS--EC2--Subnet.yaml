type: AWS::EC2::Subnet
read:
  model: ec2/service/2016-11-15/ec2-2016-11-15.json
  operation: DescribeSubnets
  absentErrors: [InvalidSubnetID.NotFound]
  identifier:
    SubnetId: SubnetIds
  # DescribeSubnets filters by a list of ids and answers with a list.
  response: Subnets[]
properties:
  AssignIpv6AddressOnCreation: AssignIpv6AddressOnCreation
  AvailabilityZone: AvailabilityZone
  AvailabilityZoneId: AvailabilityZoneId
  BlockPublicAccessStates:
    member: BlockPublicAccessStates
    properties:
      InternetGatewayBlockMode: InternetGatewayBlockMode
  CidrBlock: CidrBlock
  EnableDns64: EnableDns64
  Ipv6Native: Ipv6Native
  MapPublicIpOnLaunch: MapPublicIpOnLaunch
  OutpostArn: OutpostArn
  PrivateDnsNameOptionsOnLaunch:
    member: PrivateDnsNameOptionsOnLaunch
    properties:
      EnableResourceNameDnsAAAARecord: EnableResourceNameDnsAAAARecord
      EnableResourceNameDnsARecord: EnableResourceNameDnsARecord
      HostnameType: HostnameType
  SubnetId: SubnetId
  Tags:
    member: Tags
    properties:
      Key: Key
      Value: Value
  VpcId: VpcId
skip:
  Ipv6CidrBlock: which association's block Cloud Control reports is unproven; no subnet parity has run against holds an IPv6 block
  Ipv6CidrBlocks: whether Cloud Control reports disassociated blocks is unproven; no subnet parity has run against holds an IPv6 block
also:
  # The subnet's network ACL association, found by filtering the ACLs on
  # it; Cloud Control reports the association's id, not the ACL's.
  - operation: DescribeNetworkAcls
    input:
      Filters:
        - Name: association.subnet-id
          Values: ["{SubnetId}"]
    response: NetworkAcls[]
    properties:
      NetworkAclAssociationId:
        member: Associations[SubnetId={SubnetId}].NetworkAclAssociationId
absentIds:
  - subnet-0123456789abcdef0
