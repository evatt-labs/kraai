type: AWS::DynamoDB::Table
read:
  model: dynamodb/service/2012-08-10/dynamodb-2012-08-10.json
  operation: DescribeTable
  identifier:
    TableName: TableName
  response: Table
  absentErrors: [ResourceNotFoundException]
  # A table, or one of its indexes, is refused every change but a delete
  # while it settles the last one.
  busy:
    TableStatus: [CREATING, UPDATING, DELETING, ARCHIVING]
    GlobalSecondaryIndexes[].IndexStatus: [CREATING, UPDATING, DELETING]
    VectorIndexes[].IndexStatus: [CREATING, UPDATING, DELETING]
  # Tags and resource policies are read by ARN.
  capture:
    Arn: TableArn
    StreamArn: LatestStreamArn
# A global secondary index takes minutes to backfill even on an empty table.
wait: 20m
properties:
  Arn: TableArn
  AttributeDefinitions:
    member: AttributeDefinitions
    properties:
      AttributeName: AttributeName
      AttributeType: AttributeType
  # DescribeTable carries no billing summary for a table created with
  # provisioned capacity and never switched; Cloud Control reads it as
  # PROVISIONED.
  BillingMode:
    member: BillingModeSummary.BillingMode
    default: PROVISIONED
  DeletionProtectionEnabled: DeletionProtectionEnabled
  GlobalSecondaryIndexes:
    member: GlobalSecondaryIndexes
    properties:
      IndexName: IndexName
      KeySchema:
        member: KeySchema
        properties:
          AttributeName: AttributeName
          KeyType: KeyType
      OnDemandThroughput:
        member: OnDemandThroughput
        properties:
          MaxReadRequestUnits: MaxReadRequestUnits
          MaxWriteRequestUnits: MaxWriteRequestUnits
      Projection:
        member: Projection
        properties:
          NonKeyAttributes: NonKeyAttributes
          ProjectionType: ProjectionType
      ProvisionedThroughput:
        member: ProvisionedThroughput
        # An on-demand table reports zero throughput, which Cloud Control
        # omits.
        unless:
          BillingMode: [PAY_PER_REQUEST]
        properties:
          ReadCapacityUnits: ReadCapacityUnits
          WriteCapacityUnits: WriteCapacityUnits
      WarmThroughput:
        member: WarmThroughput
        properties:
          ReadUnitsPerSecond: ReadUnitsPerSecond
          WriteUnitsPerSecond: WriteUnitsPerSecond
  LocalSecondaryIndexes:
    member: LocalSecondaryIndexes
    properties:
      IndexName: IndexName
      KeySchema:
        member: KeySchema
        properties:
          AttributeName: AttributeName
          KeyType: KeyType
      Projection:
        member: Projection
        properties:
          NonKeyAttributes: NonKeyAttributes
          ProjectionType: ProjectionType
  OnDemandThroughput:
    member: OnDemandThroughput
    properties:
      MaxReadRequestUnits: MaxReadRequestUnits
      MaxWriteRequestUnits: MaxWriteRequestUnits
  ProvisionedThroughput:
    member: ProvisionedThroughput
    unless:
      BillingMode: [PAY_PER_REQUEST]
    properties:
      ReadCapacityUnits: ReadCapacityUnits
      WriteCapacityUnits: WriteCapacityUnits
  # A table encrypted with the AWS-owned key, the default, carries no
  # SSEDescription; Cloud Control reads it as not enabled.
  SSESpecification:
    member: SSEDescription
    default: {SSEEnabled: false}
    properties:
      KMSMasterKeyId: KMSMasterKeyArn
      SSEType: SSEType
      SSEEnabled:
        member: Status
        trueWhen: [ENABLED, UPDATING]
  StreamArn: LatestStreamArn
  StreamSpecification:
    member: StreamSpecification
    properties:
      StreamViewType: StreamViewType
  TableClass: TableClassSummary.TableClass
  TableName: TableName
  VectorIndexes:
    member: VectorIndexes
    properties:
      Dimensions: Dimensions
      DistanceFunction: DistanceFunction
      IndexName: IndexName
      Projection:
        member: Projection
        properties:
          NonKeyAttributes: NonKeyAttributes
          ProjectionType: ProjectionType
      SearchSchema:
        member: SearchSchema
        properties:
          AttributeName: AttributeName
          SearchSchemaElementType: SearchSchemaElementType
      VectorAttribute:
        member: VectorAttribute
        properties:
          AttributeName: AttributeName
  WarmThroughput:
    member: WarmThroughput
    properties:
      ReadUnitsPerSecond: ReadUnitsPerSecond
      WriteUnitsPerSecond: WriteUnitsPerSecond
  KeySchema:
    member: KeySchema
    properties:
      AttributeName: AttributeName
      KeyType: KeyType
also:
  - operation: DescribeContinuousBackups
    identifier:
      TableName: TableName
    properties:
      PointInTimeRecoverySpecification:
        member: ContinuousBackupsDescription.PointInTimeRecoveryDescription
        properties:
          RecoveryPeriodInDays: RecoveryPeriodInDays
          PointInTimeRecoveryEnabled:
            member: PointInTimeRecoveryStatus
            trueWhen: [ENABLED]
  - operation: DescribeTimeToLive
    identifier:
      TableName: TableName
    properties:
      TimeToLiveSpecification:
        member: TimeToLiveDescription
        properties:
          AttributeName: AttributeName
          Enabled:
            member: TimeToLiveStatus
            trueWhen: [ENABLED, ENABLING]
  # Contributor insights answer flat at the output's root.
  - operation: DescribeContributorInsights
    identifier:
      TableName: TableName
    properties:
      ContributorInsightsSpecification:
        member: "."
        properties:
          Enabled:
            member: ContributorInsightsStatus
            trueWhen: [ENABLED, ENABLING]
          Mode: ContributorInsightsMode
  - operation: DescribeContributorInsights
    each: GlobalSecondaryIndexes
    identifier:
      TableName: TableName
    input:
      IndexName: "{IndexName}"
    properties:
      ContributorInsightsSpecification:
        member: "."
        properties:
          Enabled:
            member: ContributorInsightsStatus
            trueWhen: [ENABLED, ENABLING]
          Mode: ContributorInsightsMode
  - operation: DescribeKinesisStreamingDestination
    identifier:
      TableName: TableName
    properties:
      KinesisStreamSpecification:
        member: KinesisDataStreamDestinations[DestinationStatus=ACTIVE]
        properties:
          ApproximateCreationDateTimePrecision: ApproximateCreationDateTimePrecision
          StreamArn: StreamArn
  - operation: ListTagsOfResource
    input:
      ResourceArn: "{Arn}"
    properties:
      Tags:
        member: Tags
        properties:
          Key: Key
          Value: Value
  # No policy is PolicyNotFoundException.
  - operation: GetResourcePolicy
    absentErrors: [PolicyNotFoundException]
    input:
      ResourceArn: "{Arn}"
    properties:
      ResourcePolicy:
        member: "."
        properties:
          PolicyDocument:
            member: Policy
            transform: json
  - operation: GetResourcePolicy
    each: StreamSpecification
    absentErrors: [PolicyNotFoundException]
    input:
      ResourceArn: "{StreamArn}"
    properties:
      ResourcePolicy:
        member: "."
        properties:
          PolicyDocument:
            member: Policy
            transform: json
  - operation: ListTagsOfResource
    each: StreamSpecification
    input:
      ResourceArn: "{StreamArn}"
    properties:
      Tags:
        member: Tags
        properties:
          Key: Key
          Value: Value
create:
  operation: CreateTable
  # A table is named by kraai's identity tag, so a retried create names the
  # table it made. The API allows 255 characters.
  name:
    property: TableName
    tag: kraai:resource-name
    maxLength: 255
  # A global secondary index is sent as the manifest has it; a per-index
  # ContributorInsightsSpecification is not a CreateTable member, and no
  # call sets it yet.
  input:
    TableName: "{TableName}"
    AttributeDefinitions: "{AttributeDefinitions}"
    KeySchema: "{KeySchema}"
    BillingMode: "{BillingMode}"
    ProvisionedThroughput: "{ProvisionedThroughput}"
    OnDemandThroughput: "{OnDemandThroughput}"
    WarmThroughput: "{WarmThroughput}"
    GlobalSecondaryIndexes: "{GlobalSecondaryIndexes}"
    LocalSecondaryIndexes: "{LocalSecondaryIndexes}"
    VectorIndexes: "{VectorIndexes}"
    SSESpecification:
      Enabled: "{SSESpecification.SSEEnabled}"
      SSEType: "{SSESpecification.SSEType}"
      KMSMasterKeyId: "{SSESpecification.KMSMasterKeyId}"
    StreamSpecification:
      StreamEnabled: true
      StreamViewType: "{StreamSpecification.StreamViewType}"
    TableClass: "{TableClass}"
    DeletionProtectionEnabled: "{DeletionProtectionEnabled}"
    ResourcePolicy: "{ResourcePolicy.PolicyDocument:json}"
    Tags: "{Tags}"
  identifier:
    TableName: TableDescription.TableName
# Every call but the capacity group and the stream is its own call: the API
# takes one kind of change per UpdateTable, and waits for the table between
# them. Capacity is not sent together: a switch to on-demand would resend
# the provisioned throughput read back, which the API refuses.
#
# Not routed, so the type is not lifecycle complete:
# ContributorInsightsSpecification, KinesisStreamSpecification
# and ImportSourceSpecification, which CreateTable has no member for.
# StreamSpecification is set, never changed: enabling a stream on a table
# that has one is refused, so a new view type needs a disable first, which
# nothing here does. The stream's own ResourcePolicy and Tags are not
# written either.
update:
  - operation: UpdateTable
    properties: [BillingMode, ProvisionedThroughput, OnDemandThroughput]
    input:
      TableName: "{TableName}"
      BillingMode: "{BillingMode}"
      ProvisionedThroughput: "{ProvisionedThroughput}"
      OnDemandThroughput: "{OnDemandThroughput}"
  - operation: UpdateTable
    properties: [SSESpecification]
    input:
      TableName: "{TableName}"
      SSESpecification:
        Enabled: "{SSESpecification.SSEEnabled}"
        SSEType: "{SSESpecification.SSEType}"
        KMSMasterKeyId: "{SSESpecification.KMSMasterKeyId}"
  - operation: UpdateTable
    properties: [StreamSpecification]
    input:
      TableName: "{TableName}"
      StreamSpecification:
        StreamEnabled: true
        StreamViewType: "{StreamSpecification.StreamViewType}"
  - operation: UpdateTable
    properties: [TableClass]
    input:
      TableName: "{TableName}"
      TableClass: "{TableClass}"
  - operation: UpdateTable
    properties: [DeletionProtectionEnabled]
    input:
      TableName: "{TableName}"
      DeletionProtectionEnabled: "{DeletionProtectionEnabled}"
  - operation: UpdateTable
    properties: [WarmThroughput]
    input:
      TableName: "{TableName}"
      WarmThroughput: "{WarmThroughput}"
  # UpdateTable takes one index created or deleted per call, and refuses
  # both beside a table change, so each is its own call with the table
  # settled between them. The index's key attributes must be among the
  # call's AttributeDefinitions, which the route lends. An index's
  # ContributorInsightsSpecification is in no call: an element differing
  # only there is refused before any call, and a new index is created
  # without it.
  - list:
      property: GlobalSecondaryIndexes
      key: [IndexName]
      oneAtATime: true
      immutable: [KeySchema, Projection]
      with: [AttributeDefinitions]
      element:
        IndexName: "{IndexName}"
        KeySchema: "{KeySchema}"
        Projection: "{Projection}"
        ProvisionedThroughput: "{ProvisionedThroughput}"
        OnDemandThroughput: "{OnDemandThroughput}"
        WarmThroughput: "{WarmThroughput}"
      add:
        operation: UpdateTable
        input:
          TableName: "{TableName}"
          AttributeDefinitions: "{AttributeDefinitions}"
          GlobalSecondaryIndexUpdates: [{Create: "{added:only}"}]
      remove:
        operation: UpdateTable
        input:
          TableName: "{TableName}"
          GlobalSecondaryIndexUpdates: [{Delete: {IndexName: "{removedKeys:only}"}}]
      changes:
        - members: [ProvisionedThroughput, OnDemandThroughput, WarmThroughput]
          element:
            IndexName: "{IndexName}"
            ProvisionedThroughput: "{ProvisionedThroughput}"
            OnDemandThroughput: "{OnDemandThroughput}"
            WarmThroughput: "{WarmThroughput}"
          operation: UpdateTable
          input:
            TableName: "{TableName}"
            GlobalSecondaryIndexUpdates: [{Update: "{changed:only}"}]
  # A vector index is created or deleted, never changed: one that differs
  # from the index of its name is refused.
  - list:
      property: VectorIndexes
      key: [IndexName]
      oneAtATime: true
      immutable: [Dimensions, DistanceFunction, Projection, SearchSchema, VectorAttribute]
      add:
        operation: UpdateTable
        input:
          TableName: "{TableName}"
          VectorIndexUpdates: [{Create: "{added:only}"}]
      remove:
        operation: UpdateTable
        input:
          TableName: "{TableName}"
          VectorIndexUpdates: [{Delete: {IndexName: "{removedKeys:only}"}}]
  - tags:
      property: Tags
      add:
        operation: TagResource
        input:
          ResourceArn: "{Arn}"
          Tags: "{added}"
      remove:
        operation: UntagResource
        input:
          ResourceArn: "{Arn}"
          TagKeys: "{removed}"
  # A policy dropped from the manifest is left in place.
  - operation: PutResourcePolicy
    properties: [ResourcePolicy]
    input:
      ResourceArn: "{Arn}"
      Policy: "{ResourcePolicy.PolicyDocument:json}"
  # Backups are not available for a moment after the table is created.
  - operation: UpdateContinuousBackups
    properties: [PointInTimeRecoverySpecification]
    retryErrors: [ContinuousBackupsUnavailableException]
    input:
      TableName: "{TableName}"
      PointInTimeRecoverySpecification: "{PointInTimeRecoverySpecification}"
  # A table's time to live changes once an hour; a second change is the
  # API's own refusal, not retried.
  - operation: UpdateTimeToLive
    properties: [TimeToLiveSpecification]
    input:
      TableName: "{TableName}"
      TimeToLiveSpecification: "{TimeToLiveSpecification}"
delete:
  operation: DeleteTable
  input:
    TableName: "{TableName}"
  absentErrors: [ResourceNotFoundException]
  # A table cannot be deleted while it is being created or has an index
  # being built.
  retryErrors: [ResourceInUseException]
# The key schema and local secondary indexes cannot change: UpdateTable has
# no member for either.
createOnly: [KeySchema, LocalSecondaryIndexes]
# A create or update naming one of these goes to Cloud Control instead.
unsupported:
  ContributorInsightsSpecification: no call sets it yet; UpdateContributorInsights takes an enum, not a boolean
  KinesisStreamSpecification: enabling a destination is a separate call pair with no route yet
  ImportSourceSpecification: CreateTable has no member for it; a table is imported with ImportTable
  StreamSpecification.ResourcePolicy: a stream's policy is put by the stream's ARN, which no call here writes
  StreamSpecification.Tags: a stream is tagged by its ARN, which no call here writes
# The harness sets one property per update, in name order, so deletion
# protection, on at create, goes off first and the delete at the end is never
# refused. A capacity switch needs two properties in one change, so only the
# on-demand ceiling is exercised. The time to live is set once, as it changes
# once an hour. The index added by the update is keyed by the sort key the
# table is created with, so the attribute it needs is already defined; a
# table may not define an attribute no key uses.
lifecycle:
  create:
    AttributeDefinitions: [{AttributeName: pk, AttributeType: S}, {AttributeName: sk, AttributeType: S}]
    KeySchema: [{AttributeName: pk, KeyType: HASH}, {AttributeName: sk, KeyType: RANGE}]
    BillingMode: PAY_PER_REQUEST
    DeletionProtectionEnabled: true
  update:
    DeletionProtectionEnabled: false
    GlobalSecondaryIndexes:
      - IndexName: by-sk
        KeySchema: [{AttributeName: sk, KeyType: HASH}]
        Projection: {ProjectionType: KEYS_ONLY}
    OnDemandThroughput: {MaxReadRequestUnits: 5, MaxWriteRequestUnits: 5}
    PointInTimeRecoverySpecification: {PointInTimeRecoveryEnabled: true}
    ResourcePolicy:
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: {AWS: "arn:aws:iam::{account}:root"}
            Action: dynamodb:GetItem
            Resource: "arn:aws:dynamodb:{region}:{account}:table/{name}"
    SSESpecification: {SSEEnabled: true, SSEType: KMS, KMSMasterKeyId: "{kmsKeyArn}"}
    StreamSpecification: {StreamViewType: NEW_AND_OLD_IMAGES}
    TableClass: STANDARD_INFREQUENT_ACCESS
    Tags: [{Key: team, Value: kraai}]
    TimeToLiveSpecification: {Enabled: true, AttributeName: expires}
absentIds:
  - kraai-absent-probe-table

