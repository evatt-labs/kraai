also:
  # The read handler finds the default network ACL and security group by
  # filtering on the VPC, and reads each DNS attribute in its own call.
  - operation: DescribeNetworkAcls
    input:
      Filters:
        - Name: vpc-id
          Values: ["{VpcId}"]
        - Name: default
          Values: ["true"]
    response: NetworkAcls[]
    properties:
      DefaultNetworkAcl: NetworkAclId
  - operation: DescribeSecurityGroups
    input:
      Filters:
        - Name: vpc-id
          Values: ["{VpcId}"]
        - Name: group-name
          Values: ["default"]
    response: SecurityGroups[]
    properties:
      DefaultSecurityGroup: GroupId
  - operation: DescribeVpcAttribute
    identifier:
      VpcId: VpcId
    input:
      Attribute: enableDnsSupport
    properties:
      EnableDnsSupport: EnableDnsSupport.Value
  - operation: DescribeVpcAttribute
    identifier:
      VpcId: VpcId
    input:
      Attribute: enableDnsHostnames
    properties:
      EnableDnsHostnames: EnableDnsHostnames.Value
