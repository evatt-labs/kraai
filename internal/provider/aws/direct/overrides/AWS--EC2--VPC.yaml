type: AWS::EC2::VPC
read:
  model: ec2/service/2016-11-15/ec2-2016-11-15.json
  operation: DescribeVpcs
  absentErrors: [InvalidVpcID.NotFound]
  identifier:
    VpcId: VpcIds
  # DescribeVpcs filters by a list of ids and answers with a list.
  response: Vpcs[]
  # A new VPC answers pending until it is usable.
  busy:
    State: [pending]
properties:
  CidrBlock: CidrBlock
  CidrBlockAssociations:
    member: CidrBlockAssociationSet[].AssociationId
  InstanceTenancy: InstanceTenancy
  Ipv6CidrBlocks:
    member: Ipv6CidrBlockAssociationSet[].Ipv6CidrBlock
  Tags:
    member: Tags
    properties:
      Key: Key
      Value: Value
  VpcEncryptionControl:
    member: EncryptionControl
    properties:
      Mode: Mode
      ResourceExclusions:
        member: ResourceExclusions
        properties:
          EgressOnlyInternetGateway:
            member: EgressOnlyInternetGateway
            properties:
              State: State
              StateMessage: StateMessage
          ElasticFileSystem:
            member: ElasticFileSystem
            properties:
              State: State
              StateMessage: StateMessage
          InternetGateway:
            member: InternetGateway
            properties:
              State: State
              StateMessage: StateMessage
          Lambda:
            member: Lambda
            properties:
              State: State
              StateMessage: StateMessage
          NatGateway:
            member: NatGateway
            properties:
              State: State
              StateMessage: StateMessage
          VirtualPrivateGateway:
            member: VirtualPrivateGateway
            properties:
              State: State
              StateMessage: StateMessage
          VpcLattice:
            member: VpcLattice
            properties:
              State: State
              StateMessage: StateMessage
          VpcPeering:
            member: VpcPeering
            properties:
              State: State
              StateMessage: StateMessage
      State: State
      StateMessage: StateMessage
      VpcEncryptionControlId: VpcEncryptionControlId
      VpcId: VpcId
  VpcId: VpcId
also:
  # The read handler finds the default network ACL and security group by
  # filtering on the VPC, and reads each DNS attribute in its own call.
  - operation: DescribeNetworkAcls
    input:
      Filters:
        - Name: vpc-id
          Values: ["{VpcId}"]
        - Name: default
          Values: ["true"]
    response: NetworkAcls[]
    properties:
      DefaultNetworkAcl: NetworkAclId
  - operation: DescribeSecurityGroups
    input:
      Filters:
        - Name: vpc-id
          Values: ["{VpcId}"]
        - Name: group-name
          Values: ["default"]
    response: SecurityGroups[]
    properties:
      DefaultSecurityGroup: GroupId
  - operation: DescribeVpcAttribute
    identifier:
      VpcId: VpcId
    input:
      Attribute: enableDnsSupport
    properties:
      EnableDnsSupport: EnableDnsSupport.Value
  - operation: DescribeVpcAttribute
    identifier:
      VpcId: VpcId
    input:
      Attribute: enableDnsHostnames
    properties:
      EnableDnsHostnames: EnableDnsHostnames.Value
create:
  operation: CreateVpc
  input:
    CidrBlock: "{CidrBlock}"
    InstanceTenancy: "{InstanceTenancy}"
    Ipv4IpamPoolId: "{Ipv4IpamPoolId}"
    Ipv4NetmaskLength: "{Ipv4NetmaskLength}"
    TagSpecifications:
      - ResourceType: vpc
        Tags: "{Tags:wire}"
    # CreateVpc's own encryption control member is flat, unlike the read's
    # nested ResourceExclusions.<Service>.State; the schema's exclusions are
    # flat siblings of Mode too, so a dotted placeholder per member sends
    # every one it can. The exclusions are write-only and the read never
    # carries them back, so a create that sets one never finishes waiting:
    # see the lifecycle note below.
    VpcEncryptionControl:
      Mode: "{VpcEncryptionControl.Mode}"
      EgressOnlyInternetGatewayExclusion: "{VpcEncryptionControl.EgressOnlyInternetGatewayExclusion}"
      ElasticFileSystemExclusion: "{VpcEncryptionControl.ElasticFileSystemExclusion}"
      InternetGatewayExclusion: "{VpcEncryptionControl.InternetGatewayExclusion}"
      LambdaExclusion: "{VpcEncryptionControl.LambdaExclusion}"
      NatGatewayExclusion: "{VpcEncryptionControl.NatGatewayExclusion}"
      VirtualPrivateGatewayExclusion: "{VpcEncryptionControl.VirtualPrivateGatewayExclusion}"
      VpcLatticeExclusion: "{VpcEncryptionControl.VpcLatticeExclusion}"
      VpcPeeringExclusion: "{VpcEncryptionControl.VpcPeeringExclusion}"
  identifier:
    VpcId: Vpc.VpcId
update:
  # ModifyVpcAttribute takes one attribute per call.
  - operation: ModifyVpcAttribute
    properties: [EnableDnsSupport]
    input:
      VpcId: "{VpcId}"
      EnableDnsSupport: {Value: "{EnableDnsSupport}"}
  - operation: ModifyVpcAttribute
    properties: [EnableDnsHostnames]
    input:
      VpcId: "{VpcId}"
      EnableDnsHostnames: {Value: "{EnableDnsHostnames}"}
  # The API only allows dedicated tenancy relaxed to default, never the
  # reverse; the schema still leaves the property updatable.
  - operation: ModifyVpcTenancy
    properties: [InstanceTenancy]
    input:
      VpcId: "{VpcId}"
      InstanceTenancy: "{InstanceTenancy}"
  - tags:
      property: Tags
      add:
        operation: CreateTags
        input:
          Resources: ["{VpcId}"]
          Tags: "{added:wire}"
      remove:
        operation: DeleteTags
        input:
          Resources: ["{VpcId}"]
          Tags: "{removed:keys}"
delete:
  operation: DeleteVpc
  input:
    VpcId: "{VpcId}"
  absentErrors: [InvalidVpcID.NotFound]
lifecycle:
  create:
    CidrBlock: 10.99.0.0/16
  # The harness sets these one at a time in sorted-key order:
  # EnableDnsHostnames before EnableDnsSupport. Unverified: whether
  # disabling DNS support after enabling DNS hostnames is refused, given
  # only the reverse order ("enabling hostnames needs support already on")
  # is documented.
  update:
    EnableDnsHostnames: true
    EnableDnsSupport: false
    Tags: [{Key: team, Value: kraai}]
absentIds:
  - vpc-0a1b2c3d4e5f60718
