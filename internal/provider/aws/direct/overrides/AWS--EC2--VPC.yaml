  operation: DescribeVpcs
  absentErrors: [InvalidVpcID.NotFound]
  identifier:
    VpcId: VpcIds
  # DescribeVpcs filters by a list of ids and answers with a list.
  response: Vpcs[]
properties:
  CidrBlock: CidrBlock
  CidrBlockAssociations:
    member: CidrBlockAssociationSet[].AssociationId
  InstanceTenancy: InstanceTenancy
  Ipv6CidrBlocks:
    member: Ipv6CidrBlockAssociationSet[].Ipv6CidrBlock
  Tags:
    member: Tags
    properties:
      Key: Key
      Value: Value
  VpcEncryptionControl:
    member: EncryptionControl
    properties:
      Mode: Mode
      ResourceExclusions:
        member: ResourceExclusions
        properties:
          EgressOnlyInternetGateway:
            member: EgressOnlyInternetGateway
            properties:
              State: State
              StateMessage: StateMessage
          ElasticFileSystem:
            member: ElasticFileSystem
            properties:
              State: State
              StateMessage: StateMessage
          InternetGateway:
            member: InternetGateway
            properties:
              State: State
              StateMessage: StateMessage
          Lambda:
            member: Lambda
            properties:
              State: State
              StateMessage: StateMessage
          NatGateway:
            member: NatGateway
            properties:
              State: State
              StateMessage: StateMessage
          VirtualPrivateGateway:
            member: VirtualPrivateGateway
            properties:
              State: State
              StateMessage: StateMessage
          VpcLattice:
            member: VpcLattice
            properties:
              State: State
              StateMessage: StateMessage
