type: AWS::S3::Bucket
read:
  model: s3/service/2006-03-01/s3-2006-03-01.json
  operation: GetBucketVersioning
  identifier:
    BucketName: Bucket
  absentErrors: [NoSuchBucket]
# Every call goes to the regional host with the bucket in the path, which
# each operation's URI already leads with.
endpointParams:
  ForcePathStyle: true
  Bucket: "{Bucket}"
# Bucket names are global; one carrying the account is not a stranger's.
absentIds:
  - kraai-absent-probe-{account}-{region}
properties:
  BucketName: '{BucketName}'
  # No S3 call returns these; Cloud Control builds them from the name and
  # the bucket's region, which a read at this endpoint is in.
  Arn: 'arn:aws:s3:::{BucketName}'
  DomainName: '{BucketName}.s3.amazonaws.com'
  RegionalDomainName: '{BucketName}.s3.{region}.amazonaws.com'
  DualStackDomainName: '{BucketName}.s3.dualstack.{region}.amazonaws.com'
  # Website endpoints are s3-website.REGION, except in the regions below,
  # which keep the older s3-website-REGION form: the "Amazon S3 website
  # endpoints" table of https://docs.aws.amazon.com/general/latest/gr/s3.html,
  # read 2026-10-05.
  WebsiteURL:
    member: 'http://{BucketName}.s3-website.{region}.amazonaws.com'
    regions:
      ap-northeast-1: 'http://{BucketName}.s3-website-{region}.amazonaws.com'
      ap-southeast-1: 'http://{BucketName}.s3-website-{region}.amazonaws.com'
      ap-southeast-2: 'http://{BucketName}.s3-website-{region}.amazonaws.com'
      eu-west-1: 'http://{BucketName}.s3-website-{region}.amazonaws.com'
      sa-east-1: 'http://{BucketName}.s3-website-{region}.amazonaws.com'
      us-east-1: 'http://{BucketName}.s3-website-{region}.amazonaws.com'
      us-west-1: 'http://{BucketName}.s3-website-{region}.amazonaws.com'
      us-west-2: 'http://{BucketName}.s3-website-{region}.amazonaws.com'
  VersioningConfiguration:
    member: .
    properties:
      Status: Status
also:
  - operation: GetBucketAbac
    identifier:
      BucketName: Bucket
    response: AbacStatus
    absentErrors: [NoSuchBucket]
    properties:
      AbacStatus: Status
  - operation: GetBucketAccelerateConfiguration
    identifier:
      BucketName: Bucket
    absentErrors: [NoSuchBucket]
    properties:
      AccelerateConfiguration:
        member: .
        properties:
          AccelerationStatus: Status
  - operation: GetBucketEncryption
    identifier:
      BucketName: Bucket
    response: ServerSideEncryptionConfiguration
    absentErrors: [NoSuchBucket]
    properties:
      BucketEncryption:
        member: .
        properties:
          ServerSideEncryptionConfiguration:
            member: Rules
            properties:
              BlockedEncryptionTypes:
                member: BlockedEncryptionTypes
                properties:
                  EncryptionType: EncryptionType
              BucketKeyEnabled: BucketKeyEnabled
              ServerSideEncryptionByDefault:
                member: ApplyServerSideEncryptionByDefault
                properties:
                  KMSMasterKeyID: KMSMasterKeyID
                  SSEAlgorithm: SSEAlgorithm
  - operation: GetBucketOwnershipControls
    identifier:
      BucketName: Bucket
    response: OwnershipControls
    absentErrors: [NoSuchBucket, OwnershipControlsNotFoundError]
    properties:
      OwnershipControls:
        member: .
        properties:
          Rules:
            member: Rules
            properties:
              ObjectOwnership: ObjectOwnership
  - operation: GetPublicAccessBlock
    identifier:
      BucketName: Bucket
    response: PublicAccessBlockConfiguration
    absentErrors: [NoSuchBucket, NoSuchPublicAccessBlockConfiguration]
    properties:
      PublicAccessBlockConfiguration:
        member: .
        properties:
          BlockPublicAcls: BlockPublicAcls
          BlockPublicPolicy: BlockPublicPolicy
          IgnorePublicAcls: IgnorePublicAcls
          RestrictPublicBuckets: RestrictPublicBuckets
  - operation: GetBucketTagging
    identifier:
      BucketName: Bucket
    absentErrors: [NoSuchBucket, NoSuchTagSet]
    properties:
      Tags:
        member: TagSet
        properties:
          Key: Key
          Value: Value
  - operation: GetBucketCors
    identifier:
      BucketName: Bucket
    absentErrors: [NoSuchBucket, NoSuchCORSConfiguration]
    properties:
      CorsConfiguration:
        member: .
        properties:
          CorsRules:
            member: CORSRules
            properties:
              AllowedHeaders: AllowedHeaders
              AllowedMethods: AllowedMethods
              AllowedOrigins: AllowedOrigins
              ExposedHeaders: ExposeHeaders
              Id: ID
              MaxAge: MaxAgeSeconds
  - operation: GetObjectLockConfiguration
    identifier:
      BucketName: Bucket
    response: ObjectLockConfiguration
    absentErrors: [NoSuchBucket, ObjectLockConfigurationNotFoundError]
    properties:
      ObjectLockEnabled:
        member: ObjectLockEnabled
        trueWhen: [Enabled]
      ObjectLockConfiguration:
        member: .
        properties:
          ObjectLockEnabled: ObjectLockEnabled
          Rule:
            member: Rule
            properties:
              DefaultRetention:
                member: DefaultRetention
                properties:
                  Days: Days
                  DefaultEventHold:
                    member: DefaultEventHold
                    properties:
                      Days: Days
                      Years: Years
                  Mode: Mode
                  Years: Years
  - operation: GetBucketWebsite
    identifier:
      BucketName: Bucket
    absentErrors: [NoSuchBucket, NoSuchWebsiteConfiguration]
    properties:
      WebsiteConfiguration:
        member: .
        properties:
          ErrorDocument: ErrorDocument.Key
          IndexDocument: IndexDocument.Suffix
          RedirectAllRequestsTo:
            member: RedirectAllRequestsTo
            properties:
              HostName: HostName
              Protocol: Protocol
          RoutingRules:
            member: RoutingRules
            properties:
              RedirectRule:
                member: Redirect
                properties:
                  HostName: HostName
                  HttpRedirectCode: HttpRedirectCode
                  Protocol: Protocol
                  ReplaceKeyPrefixWith: ReplaceKeyPrefixWith
                  ReplaceKeyWith: ReplaceKeyWith
              RoutingRuleCondition:
                member: Condition
                properties:
                  HttpErrorCodeReturnedEquals: HttpErrorCodeReturnedEquals
                  KeyPrefixEquals: KeyPrefixEquals
  - operation: GetBucketLogging
    identifier:
      BucketName: Bucket
    absentErrors: [NoSuchBucket]
    properties:
      LoggingConfiguration:
        member: LoggingEnabled
        properties:
          DestinationBucketName: TargetBucket
          LogFilePrefix: TargetPrefix
          TargetObjectKeyFormat:
            member: TargetObjectKeyFormat
            properties:
              SimplePrefix: SimplePrefix
              PartitionedPrefix:
                member: PartitionedPrefix
                properties:
                  PartitionDateSource: PartitionDateSource
  - operation: GetBucketReplication
    identifier:
      BucketName: Bucket
    response: ReplicationConfiguration
    absentErrors: [NoSuchBucket, ReplicationConfigurationNotFoundError]
    properties:
      ReplicationConfiguration:
        member: .
        properties:
          Role: Role
          Rules:
            member: Rules
            properties:
              DeleteMarkerReplication:
                member: DeleteMarkerReplication
                properties:
                  Status: Status
              Destination:
                member: Destination
                properties:
                  AccessControlTranslation:
                    member: AccessControlTranslation
                    properties:
                      Owner: Owner
                  Account: Account
                  Bucket: Bucket
                  EncryptionConfiguration:
                    member: EncryptionConfiguration
                    properties:
                      ReplicaKmsKeyID: ReplicaKmsKeyID
                  Metrics:
                    member: Metrics
                    properties:
                      EventThreshold:
                        member: EventThreshold
                        properties:
                          Minutes: Minutes
                      Status: Status
                  ReplicationTime:
                    member: ReplicationTime
                    properties:
                      Status: Status
                      Time:
                        member: Time
                        properties:
                          Minutes: Minutes
                  StorageClass: StorageClass
              Filter:
                member: Filter
                properties:
                  And:
                    member: And
                    properties:
                      Prefix: Prefix
                      TagFilters:
                        member: Tags
                        properties:
                          Key: Key
                          Value: Value
                  Prefix: Prefix
                  TagFilter:
                    member: Tag
                    properties:
                      Key: Key
                      Value: Value
              Id: ID
              Priority: Priority
              SourceSelectionCriteria:
                member: SourceSelectionCriteria
                properties:
                  ReplicaModifications:
                    member: ReplicaModifications
                    properties:
                      Status: Status
                  SseKmsEncryptedObjects:
                    member: SseKmsEncryptedObjects
                    properties:
                      Status: Status
              Status: Status
  - operation: ListBucketInventoryConfigurations
    identifier:
      BucketName: Bucket
    absentErrors: [NoSuchBucket]
    # The model declares no pagination; S3 pages at 100 configurations.
    pages:
      input: ContinuationToken
      output: NextContinuationToken
    properties:
      InventoryConfigurations:
        member: InventoryConfigurationList
        properties:
          Id: Id
          Enabled: IsEnabled
          IncludedObjectVersions: IncludedObjectVersions
          OptionalFields: OptionalFields
          Prefix: Filter.Prefix
          ScheduleFrequency: Schedule.Frequency
          Destination:
            member: Destination.S3BucketDestination
            properties:
              BucketAccountId: AccountId
              BucketArn: Bucket
              Format: Format
              Prefix: Prefix
  - operation: ListBucketMetricsConfigurations
    identifier:
      BucketName: Bucket
    absentErrors: [NoSuchBucket]
    pages:
      input: ContinuationToken
      output: NextContinuationToken
    properties:
      MetricsConfigurations:
        member: MetricsConfigurationList
        properties:
          Id: Id
          Prefix:
            alternatives:
              - member: Filter.Prefix
              - member: Filter.And.Prefix
          TagFilters:
            alternatives:
              - member: Filter.And.Tags
              - member: Filter.Tag
                asList: true
            properties:
              Key: Key
              Value: Value
          AccessPointArn:
            alternatives:
              - member: Filter.AccessPointArn
              - member: Filter.And.AccessPointArn
  - operation: ListBucketAnalyticsConfigurations
    identifier:
      BucketName: Bucket
    absentErrors: [NoSuchBucket]
    pages:
      input: ContinuationToken
      output: NextContinuationToken
    properties:
      AnalyticsConfigurations:
        member: AnalyticsConfigurationList
        properties:
          Id: Id
          Prefix:
            alternatives:
              - member: Filter.Prefix
              - member: Filter.And.Prefix
          TagFilters:
            alternatives:
              - member: Filter.And.Tags
              - member: Filter.Tag
                asList: true
            properties:
              Key: Key
              Value: Value
          StorageClassAnalysis:
            member: StorageClassAnalysis
            properties:
              DataExport:
                member: DataExport
                properties:
                  OutputSchemaVersion: OutputSchemaVersion
                  Destination:
                    member: Destination.S3BucketDestination
                    properties:
                      BucketAccountId: BucketAccountId
                      BucketArn: Bucket
                      Format: Format
                      Prefix: Prefix
  - operation: ListBucketIntelligentTieringConfigurations
    identifier:
      BucketName: Bucket
    absentErrors: [NoSuchBucket]
    pages:
      input: ContinuationToken
      output: NextContinuationToken
    properties:
      IntelligentTieringConfigurations:
        member: IntelligentTieringConfigurationList
        properties:
          Id: Id
          Status: Status
          Tierings:
            member: Tierings
            properties:
              AccessTier: AccessTier
              Days: Days
          Prefix:
            alternatives:
              - member: Filter.Prefix
              - member: Filter.And.Prefix
          TagFilters:
            alternatives:
              - member: Filter.And.Tags
              - member: Filter.Tag
                asList: true
            properties:
              Key: Key
              Value: Value
  - operation: GetBucketLifecycleConfiguration
    identifier:
      BucketName: Bucket
    absentErrors: [NoSuchBucket, NoSuchLifecycleConfiguration]
    properties:
      LifecycleConfiguration:
        member: .
        properties:
          TransitionDefaultMinimumObjectSize: TransitionDefaultMinimumObjectSize
          Rules:
            member: Rules
            properties:
              Id: ID
              Status: Status
              # The rule's filter is one of a prefix, a tag, size bounds or
              # an And of them, beside a deprecated top-level prefix; the
              # schema flattens them all.
              Prefix:
                alternatives:
                  - member: Filter.Prefix
                  - member: Filter.And.Prefix
                  - member: Prefix
              TagFilters:
                alternatives:
                  - member: Filter.And.Tags
                  - member: Filter.Tag
                    asList: true
                properties:
                  Key: Key
                  Value: Value
              ObjectSizeGreaterThan:
                alternatives:
                  - member: Filter.ObjectSizeGreaterThan
                    transform: text
                  - member: Filter.And.ObjectSizeGreaterThan
                    transform: text
              ObjectSizeLessThan:
                alternatives:
                  - member: Filter.ObjectSizeLessThan
                    transform: text
                  - member: Filter.And.ObjectSizeLessThan
                    transform: text
              ExpirationInDays: Expiration.Days
              ExpirationDate: Expiration.Date
              Transitions:
                member: Transitions
                properties:
                  StorageClass: StorageClass
                  TransitionInDays: Days
                  TransitionDate: Date
              NoncurrentVersionExpiration:
                member: NoncurrentVersionExpiration
                properties:
                  NoncurrentDays: NoncurrentDays
                  NewerNoncurrentVersions: NewerNoncurrentVersions
              NoncurrentVersionTransitions:
                member: NoncurrentVersionTransitions
                properties:
                  StorageClass: StorageClass
                  TransitionInDays: NoncurrentDays
                  NewerNoncurrentVersions: NewerNoncurrentVersions
              AbortIncompleteMultipartUpload:
                member: AbortIncompleteMultipartUpload
                properties:
                  DaysAfterInitiation: DaysAfterInitiation
  - operation: GetBucketNotificationConfiguration
    identifier:
      BucketName: Bucket
    absentErrors: [NoSuchBucket]
    properties:
      NotificationConfiguration:
        member: .
        properties:
          EventBridgeConfiguration:
            member: .
            properties:
              EventBridgeEnabled:
                member: EventBridgeConfiguration
                transform: present
          TopicConfigurations:
            member: TopicConfigurations
            # One schema entry per event: Cloud Control keeps only the
            # first of a configuration's events, dropping the rest.
            spread:
              property: Event
              member: Events
            properties:
              Topic: TopicArn
              Filter:
                member: Filter
                properties:
                  S3Key:
                    member: Key
                    properties:
                      Rules:
                        member: FilterRules
                        properties:
                          Name: Name
                          Value: Value
          QueueConfigurations:
            member: QueueConfigurations
            # One schema entry per event: Cloud Control keeps only the
            # first of a configuration's events, dropping the rest.
            spread:
              property: Event
              member: Events
            properties:
              Queue: QueueArn
              Filter:
                member: Filter
                properties:
                  S3Key:
                    member: Key
                    properties:
                      Rules:
                        member: FilterRules
                        properties:
                          Name: Name
                          Value: Value
          LambdaConfigurations:
            member: LambdaFunctionConfigurations
            # One schema entry per event: Cloud Control keeps only the
            # first of a configuration's events, dropping the rest.
            spread:
              property: Event
              member: Events
            properties:
              Function: LambdaFunctionArn
              Filter:
                member: Filter
                properties:
                  S3Key:
                    member: Key
                    properties:
                      Rules:
                        member: FilterRules
                        properties:
                          Name: Name
                          Value: Value
  - operation: GetBucketMetadataConfiguration
    identifier:
      BucketName: Bucket
    response: GetBucketMetadataConfigurationResult
    absentErrors: [NoSuchBucket, MetadataConfigurationNotFound]
    properties:
      MetadataConfiguration:
        member: MetadataConfigurationResult
        properties:
          Destination:
            member: DestinationResult
            properties:
              TableBucketArn: TableBucketArn
              TableBucketType: TableBucketType
              TableNamespace: TableNamespace
          JournalTableConfiguration:
            member: JournalTableConfigurationResult
            properties:
              TableArn: TableArn
              TableName: TableName
              RecordExpiration:
                member: RecordExpiration
                properties:
                  Days: Days
                  Expiration: Expiration
          InventoryTableConfiguration:
            member: InventoryTableConfigurationResult
            properties:
              ConfigurationState: ConfigurationState
              TableArn: TableArn
              TableName: TableName
          AnnotationTableConfiguration:
            member: AnnotationTableConfigurationResult
            properties:
              ConfigurationState: ConfigurationState
              Role: Role
              TableArn: TableArn
              TableName: TableName
  # The V1 metadata API is refused for an account on V2, which can hold no
  # V1 configuration: that refusal reads as none.
  - operation: GetBucketMetadataTableConfiguration
    identifier:
      BucketName: Bucket
    response: GetBucketMetadataTableConfigurationResult
    absentErrors: [NoSuchBucket, V1APIsNotAllowed]
    properties:
      MetadataTableConfiguration:
        member: MetadataTableConfigurationResult
        properties:
          S3TablesDestination:
            member: S3TablesDestinationResult
            properties:
              TableArn: TableArn
              TableBucketArn: TableBucketArn
              TableName: TableName
              TableNamespace: TableNamespace
# A bucket is its name, which the create sends; one Cloud Control names
# from the stack is named here from the resource-name tag instead.
create:
  operation: CreateBucket
  name:
    property: BucketName
    tag: kraai:resource-name
    maxLength: 63
  input:
    Bucket: "{BucketName}"
    CreateBucketConfiguration:
      LocationConstraint: "{region:locationConstraint}"
    ObjectLockEnabledForBucket: "{ObjectLockEnabled}"
  identifier:
    BucketName: "{BucketName}"
  idempotent: true
# Each configuration is one document its own call replaces whole, after
# the create too.
update:
  - operation: PutBucketVersioning
    properties: [VersioningConfiguration]
    input:
      Bucket: "{BucketName}"
      VersioningConfiguration: "{VersioningConfiguration:wire}"
  - operation: PutBucketAccelerateConfiguration
    properties: [AccelerateConfiguration]
    input:
      Bucket: "{BucketName}"
      AccelerateConfiguration: "{AccelerateConfiguration:wire}"
  - operation: PutBucketEncryption
    properties: [BucketEncryption]
    input:
      Bucket: "{BucketName}"
      ServerSideEncryptionConfiguration: "{BucketEncryption:wire}"
  - operation: PutBucketOwnershipControls
    properties: [OwnershipControls]
    input:
      Bucket: "{BucketName}"
      OwnershipControls: "{OwnershipControls:wire}"
  - operation: PutPublicAccessBlock
    properties: [PublicAccessBlockConfiguration]
    input:
      Bucket: "{BucketName}"
      PublicAccessBlockConfiguration: "{PublicAccessBlockConfiguration:wire}"
  - operation: PutBucketCors
    properties: [CorsConfiguration]
    input:
      Bucket: "{BucketName}"
      CORSConfiguration: "{CorsConfiguration:wire}"
  - operation: PutBucketWebsite
    properties: [WebsiteConfiguration]
    input:
      Bucket: "{BucketName}"
      # The schema flattens the two documents to their key and suffix.
      WebsiteConfiguration:
        ErrorDocument:
          Key: "{WebsiteConfiguration.ErrorDocument}"
        IndexDocument:
          Suffix: "{WebsiteConfiguration.IndexDocument}"
        RedirectAllRequestsTo: "{WebsiteConfiguration.RedirectAllRequestsTo:wire}"
        RoutingRules: "{WebsiteConfiguration.RoutingRules:wire}"
  - operation: PutBucketLogging
    properties: [LoggingConfiguration]
    input:
      Bucket: "{BucketName}"
      BucketLoggingStatus:
        LoggingEnabled: "{LoggingConfiguration:wire}"
  - operation: PutObjectLockConfiguration
    properties: [ObjectLockConfiguration]
    input:
      Bucket: "{BucketName}"
      ObjectLockConfiguration: "{ObjectLockConfiguration:wire}"
  - operation: PutBucketTagging
    properties: [Tags]
    input:
      Bucket: "{BucketName}"
      Tagging:
        TagSet: "{Tags:wire}"
delete:
  operation: DeleteBucket
  input:
    Bucket: "{BucketName}"
  absentErrors: [NoSuchBucket]
# Object lock is turned on by the create alone.
createOnly: [ObjectLockEnabled]
# Under ABAC, S3 refuses a bucket's tagging and takes tags only through S3
# Control's TagResource, a service no call here reaches yet (#467).
unsupportedWhen:
  Tags:
    property: AbacStatus
    values: [Enabled]
    why: an ABAC bucket is tagged only through S3 Control, which no direct call reaches yet
unsupported:
  AbacStatus: enabling ABAC moves tagging to S3 Control, which no direct call reaches yet (#467)
  AccessControl: a legacy canned ACL, whose CloudFormation names (PublicRead) differ from the x-amz-acl values (public-read) no call maps
  BucketNamePrefix: a name generated from a prefix is Cloud Control's to make
  BucketNamespace: the create's namespace header is not sent by this client yet
  LifecycleConfiguration: its filters and actions are read through alternatives, which no call writes back yet (#467)
  NotificationConfiguration: its events are read spread across entries, which no call writes back yet (#467)
  AnalyticsConfigurations: its filters are read through alternatives, which no call writes back yet (#467)
  MetricsConfigurations: its filters are read through alternatives, which no call writes back yet (#467)
  IntelligentTieringConfigurations: its filters are read through alternatives, which no call writes back yet (#467)
  InventoryConfigurations: each configuration is its own put by id, which no call makes yet (#467)
  ReplicationConfiguration: replication needs a role and a versioned destination, which no call checks yet (#467)
  MetadataConfiguration: a metadata configuration creates S3 Tables, which no call makes yet (#467)
  MetadataTableConfiguration: the V1 metadata API is refused for accounts on V2 (#467)
# Object lock is asked for at create, so its configuration can be set; a
# bucket with no objects in it is deleted whatever its retention. The log
# target is the fixture bucket dev/s3-fixtures.sh makes.
lifecycle:
  create:
    ObjectLockEnabled: true
    Tags: [{Key: team, Value: kraai}]
  update:
    VersioningConfiguration: {Status: Enabled}
    AccelerateConfiguration: {AccelerationStatus: Enabled}
    BucketEncryption:
      ServerSideEncryptionConfiguration:
        - ServerSideEncryptionByDefault: {SSEAlgorithm: AES256}
          BucketKeyEnabled: true
    OwnershipControls: {Rules: [{ObjectOwnership: BucketOwnerPreferred}]}
    PublicAccessBlockConfiguration: {BlockPublicAcls: true, IgnorePublicAcls: true, BlockPublicPolicy: true, RestrictPublicBuckets: true}
    CorsConfiguration:
      CorsRules: [{Id: web, AllowedMethods: [GET], AllowedOrigins: ["https://example.com"], MaxAge: 300}]
    WebsiteConfiguration: {IndexDocument: index.html, ErrorDocument: error.html}
    LoggingConfiguration: {DestinationBucketName: "{logBucket}", LogFilePrefix: lifecycle/}
    ObjectLockConfiguration:
      ObjectLockEnabled: Enabled
      Rule: {DefaultRetention: {Mode: GOVERNANCE, Days: 1}}
    Tags: [{Key: team, Value: kraai}, {Key: purpose, Value: lifecycle}]
undeclaredErrors:
  MetadataConfigurationNotFound: S3's model declares no errors on GetBucketMetadataConfiguration; it answers this for a bucket with no metadata configuration.
  V1APIsNotAllowed: S3's model declares no errors on GetBucketMetadataTableConfiguration; it answers this for an account on the V2 metadata API, which can hold no V1 configuration.
  NoSuchLifecycleConfiguration: S3's model declares no errors on GetBucketLifecycleConfiguration; it answers this for a bucket with no lifecycle configuration.
  NoSuchCORSConfiguration: S3's model declares no errors on GetBucketCors; it answers this for a bucket with no CORS configuration.
  NoSuchPublicAccessBlockConfiguration: S3's model declares no errors on GetPublicAccessBlock; it answers this for a bucket with no public access block.
  NoSuchTagSet: S3's model declares no errors on GetBucketTagging; it answers this for a bucket with no tags.
  NoSuchWebsiteConfiguration: S3's model declares no errors on GetBucketWebsite; it answers this for a bucket with no website configuration.
  ObjectLockConfigurationNotFoundError: S3's model declares no errors on GetObjectLockConfiguration; it answers this for a bucket without object lock.
  OwnershipControlsNotFoundError: S3's model declares no errors on GetBucketOwnershipControls; it answers this for a bucket with no ownership controls.
  ReplicationConfigurationNotFoundError: S3's model declares no errors on GetBucketReplication; it answers this for a bucket with no replication configuration.
