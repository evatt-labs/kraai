type: AWS::SecretsManager::Secret
# The secret's value is never read: DescribeSecret carries its metadata only,
# and GetSecretValue is not called by any path of this type. SecretString and
# GenerateSecretString are write-only in the schema and so never read back.
read:
  model: secrets-manager/service/2017-10-17/secrets-manager-2017-10-17.json
  operation: DescribeSecret
  absentErrors: [ResourceNotFoundException]
  identifier:
    Id: SecretId
properties:
  Id: ARN
  Name: Name
  Description: Description
  KmsKeyId: KmsKeyId
  Type: Type
  Tags:
    member: Tags
    properties: { Key: Key, Value: Value }
  ReplicaRegions:
    member: ReplicationStatus
    properties: { Region: Region, KmsKeyId: KmsKeyId }
create:
  operation: CreateSecret
  # The model's client request token is filled once per create, so a retry
  # is answered with the secret the first call made.
  name:
    property: Name
    tag: kraai:resource-name
  input:
    Name: "{Name}"
    Description: "{Description}"
    KmsKeyId: "{KmsKeyId}"
    SecretString: "{SecretString}"
    Tags: "{Tags}"
    AddReplicaRegions: "{ReplicaRegions:wire}"
  identifier:
    Id: ARN
update:
  - operation: UpdateSecret
    properties: [Description, KmsKeyId, SecretString]
    input:
      SecretId: "{Id}"
      Description: "{Description}"
      KmsKeyId: "{KmsKeyId}"
      SecretString: "{SecretString}"
  - list:
      property: ReplicaRegions
      key: [Region]
      add:
        operation: ReplicateSecretToRegions
        input:
          SecretId: "{Id}"
          AddReplicaRegions: "{added:wire}"
      remove:
        operation: RemoveRegionsFromReplication
        input:
          SecretId: "{Id}"
          RemoveReplicaRegions: "{removedKeys}"
  - tags:
      property: Tags
      add:
        operation: TagResource
        input:
          SecretId: "{Id}"
          Tags: "{added}"
      remove:
        operation: UntagResource
        input:
          SecretId: "{Id}"
          TagKeys: "{removed}"
# Cloud Control deletes a secret at once, with no recovery window: a read
# answers ResourceNotFoundException as soon as its delete succeeds.
delete:
  operation: DeleteSecret
  input:
    SecretId: "{Id}"
    ForceDeleteWithoutRecovery: true
  absentErrors: [ResourceNotFoundException]
  clear: [ReplicaRegions]
unsupported:
  GenerateSecretString: the password is made by GetRandomPassword and merged into the template client side, which no direct call does
  Type: a managed external secret needs a partner account
# Every value is a placeholder, never a secret. The default aws/secretsmanager
# key is the only one used, and a replica in us-west-2 bills a few cents a
# month, prorated over the seconds it exists.
lifecycle:
  create:
    SecretString: kraai-lifecycle-not-a-secret
  update:
    Description: kraai lifecycle probe
    KmsKeyId: alias/aws/secretsmanager
    ReplicaRegions: [{Region: us-west-2}]
    SecretString: kraai-lifecycle-not-a-secret-2
    Tags: [{Key: team, Value: kraai}]
absentIds:
  - arn:aws:secretsmanager:{region}:{account}:secret:kraai-absent-probe-AbCdEf
