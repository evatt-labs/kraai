type: AWS::RDS::DBSubnetGroup
read:
  model: rds/service/2014-10-31/rds-2014-10-31.json
  operation: DescribeDBSubnetGroups
  absentErrors: [DBSubnetGroupNotFoundFault]
  identifier:
    DBSubnetGroupName: DBSubnetGroupName
  # DescribeDBSubnetGroups filters by a single name and answers with a list.
  response: DBSubnetGroups[]
  capture:
    Arn: DBSubnetGroupArn
properties:
  DBSubnetGroupArn: DBSubnetGroupArn
  DBSubnetGroupDescription: DBSubnetGroupDescription
  DBSubnetGroupName: DBSubnetGroupName
  SubnetIds:
    member: Subnets[].SubnetIdentifier
also:
  # Tags are read by ARN, which only the read's response carries.
  - operation: ListTagsForResource
    input:
      ResourceName: "{Arn}"
    properties:
      Tags:
        member: TagList
        properties:
          Key: Key
          Value: Value
create:
  operation: CreateDBSubnetGroup
  name:
    property: DBSubnetGroupName
    tag: kraai:resource-name
  input:
    DBSubnetGroupName: "{DBSubnetGroupName}"
    DBSubnetGroupDescription: "{DBSubnetGroupDescription}"
    SubnetIds: "{SubnetIds}"
    Tags: "{Tags}"
  # The service lowercases the name it stores; the output carries what it
  # actually made.
  identifier:
    DBSubnetGroupName: DBSubnetGroup.DBSubnetGroupName
# ModifyDBSubnetGroup requires SubnetIds and replaces the description
# alongside it, so both are sent whenever either changes.
update:
  - operation: ModifyDBSubnetGroup
    properties: [DBSubnetGroupDescription, SubnetIds]
    together: true
    input:
      DBSubnetGroupName: "{DBSubnetGroupName}"
      DBSubnetGroupDescription: "{DBSubnetGroupDescription}"
      SubnetIds: "{SubnetIds}"
  - tags:
      property: Tags
      add:
        operation: AddTagsToResource
        input:
          ResourceName: "{Arn}"
          Tags: "{added}"
      remove:
        operation: RemoveTagsFromResource
        input:
          ResourceName: "{Arn}"
          TagKeys: "{removed}"
delete:
  operation: DeleteDBSubnetGroup
  input:
    DBSubnetGroupName: "{DBSubnetGroupName}"
  absentErrors: [DBSubnetGroupNotFoundFault]
lifecycle:
  create:
    DBSubnetGroupDescription: kraai lifecycle probe
    SubnetIds: ["{subnetIdA}", "{subnetIdB}"]
  update:
    DBSubnetGroupDescription: kraai lifecycle probe updated
    SubnetIds: ["{subnetIdA}", "{subnetIdC}"]
    Tags: [{Key: team, Value: kraai}]
absentIds:
  - kraai-absent-probe-0123456789
