type: AWS::ECS::TaskDefinition
read:
  model: ecs/service/2014-11-13/ecs-2014-11-13.json
  operation: DescribeTaskDefinition
  identifier:
    TaskDefinitionArn: taskDefinition
  response: taskDefinition
  # Tags are returned only when asked for, beside the task definition.
  input:
    include: TAGS
  # A deregistered revision is still described; Cloud Control reads it as
  # gone.
  absent:
    status: [INACTIVE, DELETE_IN_PROGRESS]
probe:
  operation: ListTaskDefinitions
  input:
    status: INACTIVE
list:
  operation: ListTaskDefinitions
  # Cloud Control lists only active revisions; a deregistered one is gone.
  input:
    status: ACTIVE
