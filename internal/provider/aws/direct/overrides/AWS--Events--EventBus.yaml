type: AWS::Events::EventBus
read:
  model: eventbridge/service/2015-10-07/eventbridge-2015-10-07.json
  operation: DescribeEventBus
  absentErrors: [ResourceNotFoundException]
  identifier:
    Name: Name
  # Tags are listed by ARN.
  capture:
    Arn: Arn
properties:
  Arn: Arn
  DeadLetterConfig:
    member: DeadLetterConfig
    properties:
      Arn: Arn
  Description: Description
  KmsKeyIdentifier: KmsKeyIdentifier
  LogConfig:
    member: LogConfig
    properties:
      IncludeDetail: IncludeDetail
      Level: Level
  Name: Name
  Policy: Policy
also:
  - operation: ListTagsForResource
    input:
      ResourceARN: "{Arn}"
    properties:
      Tags:
        member: Tags
        properties:
          Key: Key
          Value: Value
absentIds:
  - kraai-absent-probe
create:
  operation: CreateEventBus
  name:
    property: Name
    tag: kraai:resource-name
  input:
    Name: "{Name}"
    EventSourceName: "{EventSourceName}"
    Description: "{Description}"
    KmsKeyIdentifier: "{KmsKeyIdentifier}"
    DeadLetterConfig: "{DeadLetterConfig}"
    LogConfig: "{LogConfig}"
    Tags: "{Tags}"
  # A bus is its name; the create answers with its ARN.
  identifier:
    Name: "{Name}"
# The policy is set by its own call, after the create too.
update:
  - operation: UpdateEventBus
    properties: [DeadLetterConfig, Description, KmsKeyIdentifier, LogConfig]
    input:
      Name: "{Name}"
      Description: "{Description}"
      KmsKeyIdentifier: "{KmsKeyIdentifier}"
      DeadLetterConfig: "{DeadLetterConfig}"
      LogConfig: "{LogConfig}"
  # Replaces the whole policy.
  - operation: PutPermission
    properties: [Policy]
    input:
      EventBusName: "{Name}"
      Policy: "{Policy:json}"
  - tags:
      property: Tags
      add:
        operation: TagResource
        input:
          ResourceARN: "{Arn}"
          Tags: "{added}"
      remove:
        operation: UntagResource
        input:
          ResourceARN: "{Arn}"
          TagKeys: "{removed}"
delete:
  operation: DeleteEventBus
  input:
    Name: "{Name}"
# The schema types the policy object or string, and Cloud Control reads it
# back as text, so the vector gives text. The bus lets its own account put
# events.
lifecycle:
  create:
    Description: kraai lifecycle probe
    LogConfig: {IncludeDetail: NONE, Level: ERROR}
  update:
    Description: kraai lifecycle probe, updated
    LogConfig: {IncludeDetail: FULL, Level: INFO}
    Policy: '{"Version":"2012-10-17","Statement":[{"Sid":"kraai-lifecycle","Effect":"Allow","Principal":{"AWS":"arn:aws:iam::{account}:root"},"Action":"events:PutEvents","Resource":"arn:aws:events:{region}:{account}:event-bus/{name}"}]}'
    Tags: [{Key: team, Value: kraai}]
