          FromPort: FromPort
          IpProtocol: IpProtocol
          ToPort: ToPort
      SecurityGroupIngress:
        member: SecurityGroupRules
        where:
          IsEgress: "false"
        properties:
          CidrIp: CidrIpv4
          CidrIpv6: CidrIpv6
          Description: Description
          FromPort: FromPort
          IpProtocol: IpProtocol
          SourcePrefixListId: PrefixListId
          SourceSecurityGroupId: ReferencedGroupInfo.GroupId
