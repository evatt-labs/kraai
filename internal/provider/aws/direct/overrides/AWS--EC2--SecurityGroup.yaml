    input:
      Filters:
        - Name: group-id
          Values: ["{Id}"]
    properties:
      SecurityGroupEgress:
        member: SecurityGroupRules
        where:
          IsEgress: "true"
        properties:
          CidrIp: CidrIpv4
          CidrIpv6: CidrIpv6
