type: AWS::RDS::DBClusterParameterGroup
read:
  model: rds/service/2014-10-31/rds-2014-10-31.json
  operation: DescribeDBClusterParameterGroups
  absentErrors: [DBParameterGroupNotFound]
  identifier:
    DBClusterParameterGroupName: DBClusterParameterGroupName
  # DescribeDBClusterParameterGroups filters by a single name and answers
  # with a list.
  response: DBClusterParameterGroups[]
  capture:
    Arn: DBClusterParameterGroupArn
properties:
  DBClusterParameterGroupName: DBClusterParameterGroupName
  Description: Description
  Family: DBParameterGroupFamily
also:
  # The schema holds the parameters set on the group, not the engine's
  # defaults.
  - operation: DescribeDBClusterParameters
    identifier:
      DBClusterParameterGroupName: DBClusterParameterGroupName
    input:
      Source: user
    properties:
      Parameters:
        member: Parameters
        keyed: [ParameterName, ParameterValue]
  # Tags are read by ARN, which only the read's response carries.
  - operation: ListTagsForResource
    input:
      ResourceName: "{Arn}"
    properties:
      Tags:
        member: TagList
        properties:
          Key: Key
          Value: Value
create:
  operation: CreateDBClusterParameterGroup
  name:
    property: DBClusterParameterGroupName
    tag: kraai:resource-name
  # The create takes no parameters; they are set by the update call once the
  # group reads.
  input:
    DBClusterParameterGroupName: "{DBClusterParameterGroupName}"
    DBParameterGroupFamily: "{Family}"
    Description: "{Description}"
    Tags: "{Tags}"
  # The service lowercases the name it stores; the output carries what it
  # actually made.
  identifier:
    DBClusterParameterGroupName: DBClusterParameterGroup.DBClusterParameterGroupName
update:
  # The parameters are a map of name to value, routed as {Key, Value}
  # elements. pending-reboot is valid for dynamic and static parameters
  # alike; immediate only for dynamic ones. Both calls take at most 20
  # parameters, which the model does not state.
  - list:
      property: Parameters
      key: [Key]
      chunk: 20
      element:
        ParameterName: "{Key}"
        ParameterValue: "{Value:string}"
        ApplyMethod: pending-reboot
      # A call right after another is refused while the group applies the
      # first: "has pending changes".
      add:
        operation: ModifyDBClusterParameterGroup
        input:
          DBClusterParameterGroupName: "{DBClusterParameterGroupName}"
          Parameters: "{added}"
        retryErrors: [InvalidDBParameterGroupState]
      remove:
        operation: ResetDBClusterParameterGroup
        input:
          DBClusterParameterGroupName: "{DBClusterParameterGroupName}"
          Parameters: "{removed}"
        retryErrors: [InvalidDBParameterGroupState]
  - tags:
      property: Tags
      add:
        operation: AddTagsToResource
        input:
          ResourceName: "{Arn}"
          Tags: "{added}"
      remove:
        operation: RemoveTagsFromResource
        input:
          ResourceName: "{Arn}"
          TagKeys: "{removed}"
delete:
  operation: DeleteDBClusterParameterGroup
  input:
    DBClusterParameterGroupName: "{DBClusterParameterGroupName}"
  absentErrors: [DBParameterGroupNotFound]
# Cluster-level parameters of the family, all dynamic: the update changes
# one, keeps one, resets one and adds one.
lifecycle:
  create:
    Description: kraai lifecycle probe
    Family: aurora-postgresql16
    Parameters: {timezone: UTC, rds.force_ssl: "1", log_autovacuum_min_duration: "5000"}
  update:
    Parameters: {timezone: US/Pacific, rds.force_ssl: "1", client_encoding: UTF8}
    Tags: [{Key: team, Value: kraai}]
absentIds:
  - kraai-absent-probe
