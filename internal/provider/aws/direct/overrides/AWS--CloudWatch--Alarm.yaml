type: AWS::CloudWatch::Alarm
read:
  model: cloudwatch/service/2010-08-01/cloudwatch-2010-08-01.json
  operation: DescribeAlarms
  identifier:
    AlarmName: AlarmNames
  response: MetricAlarms[]
  # Tags are read by the alarm's ARN.
  capture:
    Arn: AlarmArn
properties:
  ActionsEnabled: ActionsEnabled
  AlarmActions: AlarmActions
  AlarmDescription: AlarmDescription
  AlarmName: AlarmName
  Arn: AlarmArn
  ComparisonOperator: ComparisonOperator
  DatapointsToAlarm: DatapointsToAlarm
  Dimensions:
    member: Dimensions
    properties: { Name: Name, Value: Value }
  EvaluateLowSampleCountPercentile: EvaluateLowSampleCountPercentile
  EvaluationInterval: EvaluationInterval
  EvaluationPeriods: EvaluationPeriods
  ExtendedStatistic: ExtendedStatistic
  InsufficientDataActions: InsufficientDataActions
  Metrics:
    member: Metrics
    properties:
      AccountId: AccountId
      Expression: Expression
      Id: Id
      Label: Label
      MetricStat:
        member: MetricStat
        properties:
          Metric:
            member: Metric
            properties:
              Dimensions:
                member: Dimensions
                properties: { Name: Name, Value: Value }
              MetricName: MetricName
              Namespace: Namespace
          Period: Period
          Stat: Stat
          Unit: Unit
      Period: Period
      ReturnData: ReturnData
  MetricName: MetricName
  Namespace: Namespace
  OKActions: OKActions
  Period: Period
  Statistic: Statistic
  Threshold: Threshold
  ThresholdMetricId: ThresholdMetricId
  TreatMissingData: TreatMissingData
  Unit: Unit
  WarmUpConfiguration:
    member: WarmUpConfiguration
    properties:
      OnlyStartEvaluatingAfterWarmUpPeriodEnds: OnlyStartEvaluatingAfterWarmUpPeriodEnds
      WarmUpPeriodDurationInMinutes: WarmUpPeriodDurationInMinutes
  EvaluationCriteria:
    member: EvaluationCriteria
    properties:
      PromQLCriteria:
        member: PromQLCriteria
        properties:
          PendingPeriod: PendingPeriod
          Query: Query
          RecoveryPeriod: RecoveryPeriod
  EvaluationWindow:
    member: EvaluationWindow
    properties:
      SlidingWindow: SlidingWindow
      WallClockWindow:
        member: WallClockWindow
        properties:
          Timezone: Timezone
also:
  - operation: ListTagsForResource
    input:
      ResourceARN: "{Arn}"
    properties:
      Tags:
        member: Tags
        properties:
          Key: Key
          Value: Value
create:
  operation: PutMetricAlarm
  # Creates or replaces the alarm by name, so the same input again is a no-op.
  idempotent: true
  name:
    property: AlarmName
    tag: kraai:resource-name
  input:
    AlarmName: "{AlarmName}"
    ActionsEnabled: "{ActionsEnabled}"
    AlarmActions: "{AlarmActions}"
    AlarmDescription: "{AlarmDescription}"
    ComparisonOperator: "{ComparisonOperator}"
    DatapointsToAlarm: "{DatapointsToAlarm}"
    Dimensions: "{Dimensions:wire}"
    EvaluateLowSampleCountPercentile: "{EvaluateLowSampleCountPercentile}"
    EvaluationCriteria: "{EvaluationCriteria:wire}"
    EvaluationInterval: "{EvaluationInterval}"
    EvaluationPeriods: "{EvaluationPeriods}"
    EvaluationWindow: "{EvaluationWindow:wire}"
    ExtendedStatistic: "{ExtendedStatistic}"
    InsufficientDataActions: "{InsufficientDataActions}"
    MetricName: "{MetricName}"
    Metrics: "{Metrics:wire}"
    Namespace: "{Namespace}"
    OKActions: "{OKActions}"
    Period: "{Period}"
    Statistic: "{Statistic}"
    Threshold: "{Threshold}"
    ThresholdMetricId: "{ThresholdMetricId}"
    TreatMissingData: "{TreatMissingData}"
    Unit: "{Unit}"
    WarmUpConfiguration: "{WarmUpConfiguration:wire}"
    # The call takes tags only when it creates the alarm.
    Tags: "{Tags}"
  # The call answers with no body; an alarm is its name.
  identifier:
    AlarmName: "{AlarmName}"
# PutMetricAlarm replaces the whole alarm: every property is sent on any
# change, an unchanged one as read, and one never read is left unset.
update:
  - operation: PutMetricAlarm
    properties: [ActionsEnabled, AlarmActions, AlarmDescription, ComparisonOperator, DatapointsToAlarm, Dimensions, EvaluateLowSampleCountPercentile, EvaluationCriteria, EvaluationInterval, EvaluationPeriods, EvaluationWindow, ExtendedStatistic, InsufficientDataActions, MetricName, Metrics, Namespace, OKActions, Period, Statistic, Threshold, ThresholdMetricId, TreatMissingData, Unit, WarmUpConfiguration]
    together: true
    input:
      AlarmName: "{AlarmName}"
      ActionsEnabled: "{ActionsEnabled}"
      AlarmActions: "{AlarmActions}"
      AlarmDescription: "{AlarmDescription}"
      ComparisonOperator: "{ComparisonOperator}"
      DatapointsToAlarm: "{DatapointsToAlarm}"
      Dimensions: "{Dimensions:wire}"
      EvaluateLowSampleCountPercentile: "{EvaluateLowSampleCountPercentile}"
      EvaluationCriteria: "{EvaluationCriteria:wire}"
      EvaluationInterval: "{EvaluationInterval}"
      EvaluationPeriods: "{EvaluationPeriods}"
      EvaluationWindow: "{EvaluationWindow:wire}"
      ExtendedStatistic: "{ExtendedStatistic}"
      InsufficientDataActions: "{InsufficientDataActions}"
      MetricName: "{MetricName}"
      Metrics: "{Metrics:wire}"
      Namespace: "{Namespace}"
      OKActions: "{OKActions}"
      Period: "{Period}"
      Statistic: "{Statistic}"
      Threshold: "{Threshold}"
      ThresholdMetricId: "{ThresholdMetricId}"
      TreatMissingData: "{TreatMissingData}"
      Unit: "{Unit}"
      WarmUpConfiguration: "{WarmUpConfiguration:wire}"
  - tags:
      property: Tags
      add:
        operation: TagResource
        input:
          ResourceARN: "{Arn}"
          Tags: "{added}"
      remove:
        operation: UntagResource
        input:
          ResourceARN: "{Arn}"
          TagKeys: "{removed}"
delete:
  operation: DeleteAlarms
  input:
    AlarmNames: ["{AlarmName}"]
  # Names that do not exist are ignored by the call; ResourceNotFound is the
  # documented answer for one that is gone.
  absentErrors: [ResourceNotFound]
# An alarm on a metric nothing publishes bills a few cents a month, prorated
# over the seconds it exists.
lifecycle:
  create:
    Namespace: kraai/lifecycle
    MetricName: Probe
    Statistic: Average
    Period: 60
    EvaluationPeriods: 1
    Threshold: 1
    ComparisonOperator: GreaterThanThreshold
  update:
    ActionsEnabled: false
    AlarmDescription: kraai lifecycle probe
    ComparisonOperator: LessThanThreshold
    DatapointsToAlarm: 1
    Dimensions: [{Name: env, Value: lifecycle}]
    EvaluationPeriods: 2
    Period: 300
    Statistic: Sum
    Tags: [{Key: team, Value: kraai}]
    Threshold: 5
    TreatMissingData: notBreaching
    Unit: Count
absentIds:
  - kraai-absent-probe-alarm
