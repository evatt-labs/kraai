type: AWS::ElastiCache::SubnetGroup
read:
  model: elasticache/service/2015-02-02/elasticache-2015-02-02.json
  operation: DescribeCacheSubnetGroups
  identifier:
    CacheSubnetGroupName: CacheSubnetGroupName
  # DescribeCacheSubnetGroups filters by one name and answers with a list;
  # a name matching nothing is CacheSubnetGroupNotFoundFault, not an empty
  # list.
  response: CacheSubnetGroups[]
  capture:
    Arn: ARN
properties:
  CacheSubnetGroupName: CacheSubnetGroupName
  Description: CacheSubnetGroupDescription
  SubnetIds:
    member: Subnets[].SubnetIdentifier
also:
  # Tags are read by ARN, which only the read's response carries.
  - operation: ListTagsForResource
    input:
      ResourceName: "{Arn}"
    properties:
      Tags:
        member: TagList
        properties:
          Key: Key
          Value: Value
absentIds:
  - kraai-absent-probe-subnetgroup
