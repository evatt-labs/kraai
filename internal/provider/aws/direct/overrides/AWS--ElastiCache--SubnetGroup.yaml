type: AWS::ElastiCache::SubnetGroup
read:
  model: elasticache/service/2015-02-02/elasticache-2015-02-02.json
  operation: DescribeCacheSubnetGroups
  absentErrors: [CacheSubnetGroupNotFoundFault]
  identifier:
    CacheSubnetGroupName: CacheSubnetGroupName
  # DescribeCacheSubnetGroups filters by one name and answers with a list;
  # a name matching nothing is CacheSubnetGroupNotFoundFault, not an empty
  # list.
  response: CacheSubnetGroups[]
  capture:
    Arn: ARN
properties:
  CacheSubnetGroupName: CacheSubnetGroupName
  Description: CacheSubnetGroupDescription
  SubnetIds:
    member: Subnets[].SubnetIdentifier
also:
  # Tags are read by ARN, which only the read's response carries.
  - operation: ListTagsForResource
    input:
      ResourceName: "{Arn}"
    properties:
      Tags:
        member: TagList
        properties:
          Key: Key
          Value: Value
create:
  operation: CreateCacheSubnetGroup
  name:
    property: CacheSubnetGroupName
    tag: kraai:resource-name
  input:
    CacheSubnetGroupName: "{CacheSubnetGroupName}"
    CacheSubnetGroupDescription: "{Description}"
    SubnetIds: "{SubnetIds}"
    Tags: "{Tags}"
  # The service lowercases the name; the create returns the one it made.
  identifier:
    CacheSubnetGroupName: CacheSubnetGroup.CacheSubnetGroupName
update:
  # ModifyCacheSubnetGroup requires only the name; description and subnets
  # are optional, so a change to one is sent with the other as it was read
  # rather than risk the service leaving an unsent one unchanged undocumented.
  - operation: ModifyCacheSubnetGroup
    properties: [Description, SubnetIds]
    together: true
    input:
      CacheSubnetGroupName: "{CacheSubnetGroupName}"
      CacheSubnetGroupDescription: "{Description}"
      SubnetIds: "{SubnetIds}"
  - tags:
      property: Tags
      add:
        operation: AddTagsToResource
        input:
          ResourceName: "{Arn}"
          Tags: "{added}"
      remove:
        operation: RemoveTagsFromResource
        input:
          ResourceName: "{Arn}"
          TagKeys: "{removed}"
delete:
  operation: DeleteCacheSubnetGroup
  input:
    CacheSubnetGroupName: "{CacheSubnetGroupName}"
  absentErrors: [CacheSubnetGroupNotFoundFault]
lifecycle:
  create:
    Description: kraai lifecycle probe
    SubnetIds: ["{subnetIdA}"]
  update:
    Description: kraai lifecycle probe, updated
    SubnetIds: ["{subnetIdA}", "{subnetIdB}"]
    Tags: [{Key: team, Value: kraai}]
absentIds:
  - kraai-absent-probe-subnetgroup
