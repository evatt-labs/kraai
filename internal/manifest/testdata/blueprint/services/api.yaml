services:
  api:
    dir: packages/api
    databases:
      - { binding: DB, driver: sqlite }
      - { binding: PG, driver: postgres, caching: { disabled: false, maxAge: 60 } }
    keyvalue: [{ binding: CACHE }]
    objects:  [{ binding: ASSETS }]
    queues:   [{ binding: JOBS }]
    tls:      [{ binding: CERT, domain: api.acme.com }]
